# L02 전압·전류·저항 — 물의 흐름으로 이해하기

number: 2
title: "전압·전류·저항"

slides:
  - layout: title
    image: L01/mascot
    subtitle: "전기를 '물의 흐름'으로 상상해 봐요"

  - layout: goals
    title: "오늘 배울 것"
    items:
      - "전압\n= 밀어주는 힘"
      - "전류\n= 흐르는 양"
      - "저항\n= 방해하는 정도"

  - layout: figure_text
    title: "전압: 물을 밀어주는 힘"
    image: L02/water_tower
    labels:
      - {text: "높은 곳의 물", x: 0.22, y: 0.18, color: primary}
    bullets:
      - "높은 곳의 물일수록 세게 흘러나와요"
      - "전기에서는 이 '미는 힘'이 전압"
      - "전지·콘센트가 전압을 만들어 줘요"
    notes: "물탱크가 높을수록 수도꼭지 물줄기가 세지는 것을 떠올리게 한다."

  - layout: video
    title: "높이 차가 클수록 세게 흘러요"
    video: L02/voltage_height
    caption: "높이 차(전압)가 커지면 → 흐르는 물(전류)도 많아져요"
    notes: "영상 속 주황 화살표가 전압, 파란 화살표가 전류. 수위가 올라갈 때 파란 화살표가 길어지는 것을 짚어준다."

  - layout: figure_text
    title: "전류: 흐르는 전자의 양"
    image: L02/current_pipe
    bullets:
      - "1초 동안 지나가는 양이 많을수록 전류가 커요"
      - "물방울 대신 전자가 줄지어 흐른다고 생각해요"
      - "전류가 흘러야 전구가 켜지고 모터가 돌아요"
    notes: "1강의 '전자가 한 방향으로 흐르는 것 = 전류'를 다시 연결한다."

  - layout: figure_text
    title: "저항: 흐름을 방해하는 정도"
    image: L02/narrow_pipe
    labels:
      - {text: "좁은 통로", x: 0.50, y: 0.18, color: positive}
    bullets:
      - "통로가 좁으면 지나가기 어려워요"
      - "전선이 가늘거나 길면 저항이 커요"
      - "저항은 나쁜 게 아니라 '조절'에 쓰여요"
    notes: "전구의 필라멘트, 전기난로의 열선이 저항을 이용하는 예. 3강 옴의 법칙에서 이어진다."

  - layout: video
    title: "통로가 좁아지면?"
    video: L02/resistance_pipe
    caption: "저항이 커지면 → 같은 힘에서도 전류가 줄어요"

  - layout: goals
    title: "세 친구의 단위"
    items:
      - "전압\n볼트 (V)"
      - "전류\n암페어 (A)"
      - "저항\n옴 (Ω)"
    notes: "단위 이름은 모두 과학자 이름(볼타, 앙페르, 옴)에서 왔다."

  - layout: figure_text
    title: "생활 속 전압"
    image: L02/everyday_voltages
    labels:
      - {text: "1.5 V", x: 0.20, y: 0.85, color: primary}
      - {text: "5 V", x: 0.50, y: 0.85, color: primary}
      - {text: "220 V", x: 0.80, y: 0.85, color: positive}
    bullets:
      - "건전지 1개: 1.5 V"
      - "휴대폰 충전기: 5 V 정도"
      - "집 콘센트: 220 V — 매우 위험!"
    notes: "콘센트는 건전지의 약 150배. 절대 손이나 금속을 넣지 않도록 강조한다."

  - layout: quiz
    title: "퀴즈!"
    question: "물 비유에서 '파이프가 좁아지는 것'은 무엇에 해당할까?"
    choices: ["전압", "전류", "저항"]
    answer: 3

  - layout: summary
    title: "오늘의 정리"
    image: L01/mascot
    points:
      - "전압 = 밀어주는 힘 (V)"
      - "전류 = 흐르는 양 (A)"
      - "저항 = 방해하는 정도 (Ω)"
