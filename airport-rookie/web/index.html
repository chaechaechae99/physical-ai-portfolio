<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신입사원 공항 키우기</title>
<style>
  :root {
    --bg: #1b2333; --panel: #26314a; --panel2: #2f3c5a; --line: #3f4f73;
    --text: #eef2ff; --muted: #9fb0d6; --gold: #ffd166; --good: #7ee081; --bad: #ff6b6b;
    --accent: #6ea8ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif; }
  .hidden { display: none !important; }
  button { font-family: inherit; font-size: 13px; color: var(--text); background: var(--panel2);
           border: 2px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer;
           box-shadow: 0 3px 0 #141b29; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #141b29; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* 시작 화면 */
  #start { max-width: 520px; margin: 30px auto; padding: 16px; text-align: center; }
  #start h1 { font-size: 32px; margin: 0 0 6px; color: var(--gold); text-shadow: 3px 3px 0 #000; }
  #start .sub { color: var(--muted); line-height: 1.7; margin-bottom: 18px; }
  #logo { image-rendering: pixelated; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 14px; line-height: 1.8; }
  .next { color: #d29bff; font-weight: bold; }
  .diff { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 10px 12px;
          margin: 10px 0; text-align: left; display: flex; gap: 12px; align-items: center; }
  .diff button { font-size: 16px; padding: 10px 16px; min-width: 96px; }
  .diff small { color: var(--muted); white-space: pre-line; line-height: 1.5; }

  /* 게임 화면 */
  #game { max-width: 1340px; margin: 0 auto; padding: 10px 16px; }
  #hud { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; background: var(--panel);
         border: 2px solid var(--line); border-radius: 6px; padding: 8px 14px; margin-bottom: 10px; }
  #hud .money { color: var(--gold); font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
  #hud .item { color: var(--muted); font-size: 14px; }
  #hud .item b { color: var(--text); }
  #wrap { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: flex-start; }
  #mapBox { position: relative; flex: 1 1 640px; max-width: 960px; }
  #map { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; background: #000;
         border: 3px solid #0e1420; border-radius: 4px; touch-action: none; cursor: crosshair; }
  #hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); pointer-events: none;
          background: rgba(20, 24, 40, .88); border: 2px solid var(--gold); color: var(--gold);
          padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; max-width: 90%; text-align: center; }
  #hint.warn { border-color: var(--bad); color: #ffb3b3; }
  #tip { position: absolute; pointer-events: none; z-index: 5; max-width: 260px; font-size: 12px; line-height: 1.5;
         background: rgba(20, 24, 40, .95); border: 2px solid var(--bad); color: var(--text);
         padding: 6px 9px; border-radius: 6px; }
  #tip b { color: #ffb3b3; }
  #camHelp { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }
  #side { width: 330px; max-width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .box { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .box h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  #tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px;
          background: var(--panel2); border: 2px solid var(--line); border-radius: 4px; cursor: pointer;
          font-size: 11px; text-align: center; line-height: 1.25; }
  .tool canvas { width: 36px; height: 36px; image-rendering: pixelated; }
  .tool.on { border-color: var(--gold); background: #3d3a2a; }
  .tool .cost { color: var(--gold); }
  .tool.zone .name::before { content: "▦ "; color: var(--accent); }
  #planes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #planes button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 12px; }
  #planes canvas { width: 40px; height: 40px; image-rendering: pixelated; }
  #planes .cost { color: var(--gold); font-size: 11px; }
  .demand { display: flex; gap: 8px; align-items: flex-end; height: 54px; }
  .demand div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
  .demand .bar { height: 34px; background: #1b2333; border-radius: 3px; position: relative; overflow: hidden; margin-bottom: 3px; }
  .demand .bar i { position: absolute; bottom: 0; left: 0; right: 0; }
  #rule { font-size: 13px; line-height: 1.6; }
  #rule.on { border-color: var(--bad); }
  #rule.on b { color: var(--bad); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #hover { font-size: 12px; color: var(--muted); min-height: 18px; }
  #log { height: 140px; overflow-y: auto; font-size: 12px; line-height: 1.65; white-space: pre-wrap; }

  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
           align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #modal .box { max-width: 420px; text-align: center; border-color: var(--gold); }
  #modal h2 { margin-top: 0; color: var(--gold); }
  #modal p { white-space: pre-wrap; line-height: 1.7; }
</style>
</head>
<body>

<div id="start">
  <canvas id="logo" width="130" height="130"></canvas>
  <h1>신입사원 공항 키우기</h1>
  <div class="sub">입구 앞 빈 땅에 공항을 지으며 10년 안에 회장까지!<br>단, 회사 규칙은 언제든 바뀔 수 있다...</div>
  <div class="card" id="saveInfo">불러오는 중...</div>
  <p><b>난이도 선택</b></p>
  <div id="diffs"></div>
</div>

<div id="game" class="hidden">
  <div id="hud">
    <span class="money" id="money"></span>
    <span class="item" id="date"></span>
    <span class="item" id="rank"></span>
    <span class="item" id="stats"></span>
  </div>
  <div id="wrap">
    <div id="mapBox">
      <canvas id="map" width="960" height="640"></canvas>
      <div id="hint" class="hidden"></div>
      <div id="tip" class="hidden"></div>
      <div id="camHelp">✋ 이동 도구로 드래그 · 오른쪽 드래그 · 화면 가장자리에 마우스 대기: 화면 이동 · 휠: 확대/축소</div>
    </div>
    <div id="side">
      <div class="box"><h3>건설 도구 <span style="font-weight:normal">(▦ 구역: 칠하면 건물이 알아서 올라감)</span></h3><div id="tools"></div></div>
      <div class="box"><h3>비행기 구매 <span style="font-weight:normal">(격납고 1칸 = 1대)</span></h3><div id="planes"></div></div>
      <div class="row">
        <button id="btnPause">일시정지</button>
        <button id="btnSpeed"></button>
      </div>
      <div class="box"><h3>건물 수요</h3><div class="demand" id="demand"></div></div>
      <div id="hover"></div>
      <div class="box" id="rule"></div>
      <div class="box"><h3>업무 일지</h3><div id="log"></div></div>
    </div>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="box">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button id="modalOk">확인</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
const T = 32;
let N = 40;

// 회차 기록은 이 브라우저에 저장된다 (저장이 막힌 환경이면 이번 접속 동안만 기억)
let memSave = {};
function loadSave() {
  try { return JSON.parse(localStorage.getItem("airport_save")) || memSave; } catch (e) { return memSave; }
}
function storeSave(data) {
  memSave = data;
  try { localStorage.setItem("airport_save", JSON.stringify(data)); } catch (e) { /* 저장 불가 */ }
}

let SP = null;                       // 도트 데이터 (서버의 sprites.py)
const IMG = { day: {}, night: {} };  // 미리 그려둔 그림
let game = null, gameId = null, cfg = {};
let tool = "move", paused = false, speed = 1;
let modalOpen = false, modalQueue = [], tickTimer = null;
const cam = { x: 0, y: 0, zoom: 1 };

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  return res.json();
}

// ════════════════════════════════════════════
//  도트 그림
// ════════════════════════════════════════════
function buildSprites() {
  for (const mode of ["day", "night"]) {
    const pal = SP[mode];
    for (const [name, rows] of Object.entries(SP.sprites)) {
      const c = document.createElement("canvas");
      c.width = rows[0].length;
      c.height = rows.length;
      const g = c.getContext("2d");
      rows.forEach((row, y) => [...row].forEach((ch, x) => {
        if (ch === ".") return;
        g.fillStyle = pal[ch];
        g.fillRect(x, y, 1, 1);
      }));
      IMG[mode][name] = c;
    }
  }
}
const night = () => game && !game.is_day;
const spr = key => IMG[night() ? "night" : "day"][key];

function iconCanvas(img, size) {
  const ic = document.createElement("canvas");
  ic.width = ic.height = size;
  const sc = Math.min(size / img.width, size / img.height), g = ic.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.drawImage(img, (size - img.width * sc) / 2, size - img.height * sc, img.width * sc, img.height * sc);
  return ic;
}

// ════════════════════════════════════════════
//  시작 화면
// ════════════════════════════════════════════
async function showStart() {
  clearTimeout(tickTimer);
  game = null;
  $("game").classList.add("hidden");
  $("start").classList.remove("hidden");
  const lg = $("logo").getContext("2d");
  lg.imageSmoothingEnabled = false;
  lg.clearRect(0, 0, 130, 130);
  lg.drawImage(IMG.day.jumbo_rainbow_n, 0, 0, 130, 130);
  const s = await api("/api/save", { save: loadSave() });
  $("saveInfo").innerHTML =
    `플레이 ${s.runs}회 · 클리어 ${s.clears}회 · 최고 직급 <b>${s.best_rank}</b><br>` +
    `해금 시설: ${s.unlocked.length ? s.unlocked.join(", ") : "없음"}` +
    (s.next_unlock ? `<br><span class="next">다음 클리어 보상: ${s.next_unlock}</span>` : "");
  $("diffs").innerHTML = "";
  for (const d of s.difficulties) {
    const row = document.createElement("div");
    row.className = "diff";
    const b = document.createElement("button");
    b.textContent = d;
    b.onclick = () => startGame(d);
    const note = document.createElement("small");
    note.textContent = s.notices[d];
    row.append(b, note);
    $("diffs").appendChild(row);
  }
}

async function startGame(difficulty) {
  const res = await api("/api/new", { difficulty, save: loadSave() });
  if (res.error) { alertModal("오류", res.error); return; }
  storeSave(res.save);
  gameId = res.id; cfg = res; N = res.grid_size;
  tool = "move"; paused = false; speed = 1;
  fleet = []; cars = []; people = []; popups = []; jobs = []; staticKey = "";
  airside = 0; laneLock.clear(); gateBusy.clear(); spotTaken.clear();
  gateArrivals.clear(); terminalWaiting = 0;
  $("log").textContent = "";
  $("start").classList.add("hidden");
  $("game").classList.remove("hidden");
  apply(res);
  buildTools();
  buildPlaneButtons();
  // 카메라: 입구가 보이게 맵 아래쪽 가운데
  cam.zoom = 1;
  cam.x = res.entrance[1] * T + T / 2 - canvas.width / 2;
  cam.y = N * T - canvas.height + 60;
  clampCam();
  // 인트로 → 이벤트 규칙 공지
  alertModal(res.intro.title, res.intro.text);
  alertModal(`📢 이벤트 규칙 안내 (${difficulty})`, res.notice);
  tickLoop();
}

// ════════════════════════════════════════════
//  서버 응답 반영 / 패널
// ════════════════════════════════════════════
const money = v => `${Math.floor(v).toLocaleString()} ${game ? game.currency : "G"}`;

function apply(res) {
  if (res.error) { alertModal("오류", res.error); return; }
  game = res;
  refreshMapInfo();
  for (const m of res.messages) $("log").textContent += m + "\n";
  $("log").scrollTop = $("log").scrollHeight;
  for (const p of res.popups) alertModal(p.title, p.text);
  renderPanel();
  if (res.finished) {
    clearTimeout(tickTimer);
    if (res.save) storeSave(res.save);
    const title = { clear: "회장 취임!", fired: "게임 오버", timeout: "10년 결산" }[res.finished];
    let text = res.ending;
    if (res.new_unlock) text += `\n\n회차 보상 해금: ${res.new_unlock}! (다음 판에 1개 무료)`;
    alertModal(title, text, showStart);
  }
}

function renderPanel() {
  const g = game, left = g.seconds_left;
  $("money").textContent = money(g.money);
  $("date").innerHTML = `<b>${g.date}</b> ${g.is_day ? "☀ 낮" : "☾ 밤"} · 남은 ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`
                        + (paused ? " <b>[일시정지]</b>" : "");
  $("rank").innerHTML = `직급 <b>${g.rank}</b> · 성과 ${g.perf.toLocaleString()}` +
                        (g.next_rank ? ` / ${g.next_rank[0]} ${g.next_rank[1].toLocaleString()}` : "");
  $("stats").innerHTML = `✈ <b>${g.planes}</b>대 (운항 ${g.effective_planes}) · 만족도 <b>${g.satisfaction}</b> · ` +
                         `월 순이익 <b style="color:${g.expected_net >= 0 ? "var(--good)" : "var(--bad)"}">${g.expected_net >= 0 ? "+" : ""}${money(g.expected_net)}</b>`;
  $("rule").className = "box" + (g.rules.length ? " on" : "");
  $("rule").innerHTML = g.rules.length
    ? g.rules.map(r => `<b>⚠ ${r.title}</b><br>${r.desc}`).join("<br><br>")
    : `바뀐 규칙: 아직 없음<br><span style='color:var(--muted)'>${g.event_notice.replace(/\n/g, "<br>")}</span>`;
  $("btnPause").textContent = paused ? "▶ 재개" : "❚❚ 일시정지";
  $("btnSpeed").textContent = cfg.speed_ok ? `${speed}배속` : "2배속(2회차~)";
  $("btnSpeed").disabled = !cfg.speed_ok;
  for (const t of g.tools) {
    const el = document.querySelector(`.tool[data-key="${t.key}"] .cost`);
    if (el) el.textContent = t.cost === 0 ? "무료 1개" : money(t.cost);
  }
  for (const pt of g.plane_types) {
    const b = document.querySelector(`#planes button[data-key="${pt.key}"]`);
    if (!b) continue;
    b.disabled = !pt.unlocked;
    b.querySelector(".cost").textContent = pt.unlocked ? `${money(pt.price)} · 보유 ${g.fleet[pt.key]}` : `🔒 ${pt.unlock_year}년 차부터`;
  }
  // 시티즈 스카이라인식 수요 막대
  const names = { terminal: ["터미널", "#4f86f7"], shop: ["상업", "#ec407a"], shop_premium: ["고급", "#ffc107"], parking: ["주차", "#d7dde5"], parking_premium: ["타워", "#90a4ae"] };
  $("demand").innerHTML = Object.entries(g.demand).filter(([k]) => g.tools.some(t => t.key === "zone_" + k)).map(([k, v]) => {
    const h = Math.max(0, Math.min(100, v * 25));
    return `<div><div class="bar"><i style="height:${h}%;background:${names[k][1]}"></i></div>${names[k][0]}${v > 0 ? " ▲" : ""}</div>`;
  }).join("");
}

const TOOL_ICON = { road: "road5", runway: "runway_h_w", hangar_light: "hangar_light", hangar: "hangar",
                    hangar_jumbo: "hangar_jumbo", gate: "gate_n", zone_terminal: "terminal2_0",
                    zone_shop: "shop2_0", zone_shop_premium: "shop_premium2_0", zone_parking: "parking2", zone_parking_premium: "parking_premium2_0", tower: "tower", land: "tree0", demolish: "construction" };

function buildTools() {
  const list = [{ key: "move", name: "이동", cost: "화면 드래그" },
                { key: "land", name: "땅 구매", cost: "칸마다 다름" },
                ...game.tools.map(t => ({ ...t, cost: "" })),
                { key: "demolish", name: "철거", cost: "환불 없음" }];
  $("tools").innerHTML = "";
  for (const t of list) {
    const d = document.createElement("div");
    d.className = "tool" + (t.key === tool ? " on" : "") + (t.kind === "zone" ? " zone" : "");
    d.dataset.key = t.key;
    if (t.key === "move") {                      // 손바닥 아이콘
      const ic = document.createElement("canvas");
      ic.width = ic.height = 36;
      const g = ic.getContext("2d");
      g.font = "26px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("✋", 18, 20);
      d.appendChild(ic);
    } else d.appendChild(iconCanvas(IMG.day[TOOL_ICON[t.key]], 36));
    d.insertAdjacentHTML("beforeend", `<span class="name">${t.name}</span><span class="cost">${t.cost}</span>`);
    d.onclick = () => {
      tool = t.key;
      document.querySelectorAll(".tool").forEach(x => x.classList.toggle("on", x.dataset.key === tool));
      canvas.style.cursor = tool === "move" ? "grab" : "crosshair";
    };
    $("tools").appendChild(d);
  }
  renderPanel();
}

function buildPlaneButtons() {
  $("planes").innerHTML = "";
  for (const pt of game.plane_types) {
    const b = document.createElement("button");
    b.dataset.key = pt.key;
    b.appendChild(iconCanvas(IMG.day[`${pt.key}_sky_n`], 40));
    b.insertAdjacentHTML("beforeend", `<span>${pt.name}</span><span class="cost"></span>`);
    b.onclick = async () => apply(await api("/api/action", { id: gameId, type: "plane", plane: pt.key }));
    $("planes").appendChild(b);
  }
  renderPanel();
}

async function tickLoop() {
  if (!paused && !modalOpen) apply(await api("/api/tick", { id: gameId }));
  else renderPanel();
  if (game && !game.finished) tickTimer = setTimeout(tickLoop, cfg.tick_ms / speed);
}

// ════════════════════════════════════════════
//  맵 정보 도우미
// ════════════════════════════════════════════
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const inMap = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const cellOf = (r, c) => inMap(r, c) ? game.grid[r][c] : undefined;
const center = (r, c) => ({ x: c * T + T / 2, y: r * T + T / 2, r, c });
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const key = (r, c) => r * 1000 + c;

let staticKey = "", staticLayer = document.createElement("canvas");
let roadParent = new Map();   // 입구에서 이어진 도로 BFS 결과 (자동차 길찾기)
let mapInfo = {};             // 자주 쓰는 칸 목록

function refreshMapInfo() {
  roadParent = new Map();
  const [er, ec] = game.entrance;
  if (cellOf(er, ec) === "road") {
    const q = [[er, ec]];
    roadParent.set(key(er, ec), null);
    while (q.length) {
      const [r, c] = q.shift();
      for (const [dr, dc] of DIRS) {
        const nr = r + dr, nc = c + dc;
        if (cellOf(nr, nc) === "road" && !roadParent.has(key(nr, nc))) {
          roadParent.set(key(nr, nc), [r, c]);
          q.push([nr, nc]);
        }
      }
    }
  }
  const all = pred => {
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (pred(game.grid[r][c], r, c)) out.push([r, c]);
    return out;
  };
  const lv = (r, c) => game.levels[r][c];
  const roadNext = (r, c) => DIRS.map(([dr, dc]) => [r + dr, c + dc]).find(([nr, nc]) => roadParent.has(key(nr, nc)));
  const roadCount = (r, c) => DIRS.filter(([dr, dc]) => cellOf(r + dr, c + dc) === "road").length;
  mapInfo = {
    terminals: all((v, r, c) => v === "zone_terminal" && lv(r, c) > 0),
    shops: all((v, r, c) => (v === "zone_shop" || v === "zone_shop_premium") && lv(r, c) > 0),
    parkings: all((v, r, c) => (v === "zone_parking" || v === "zone_parking_premium") && lv(r, c) > 0 && roadNext(r, c))
      .map(([r, c]) => {
        const garage = game.grid[r][c] === "zone_parking_premium";   // 주차 타워는 차가 건물 안으로 들어간다
        return { r, c, road: roadNext(r, c), garage, spots: (garage ? 8 : 4) * lv(r, c) };
      }),
    terminalRoads: all((v, r, c) => v === "zone_terminal" && lv(r, c) > 0 && roadNext(r, c)).map(([r, c]) => ({ r, c, road: roadNext(r, c) })),
    hangars: all(v => v in game.hangar_kinds).map(([r, c]) => {
      const kind = game.grid[r][c];
      return { cell: [r, c], kind, size: SIZE[game.hangar_kinds[kind]] };
    }),
    gates: all(v => v === "gate"),
    lights: all((v, r, c) => v === "road" && roadCount(r, c) >= 3),   // 삼거리 이상 = 신호등
  };
  mapInfo.lightSet = new Set(mapInfo.lights.map(([r, c]) => key(r, c)));
  const road = (r, c) => cellOf(r, c) === "road";
  const front = all((v, r, c) => v === "road" && roadCount(r, c) <= 2 &&
    DIRS.some(([dr, dc]) => ["zone_terminal", "zone_parking"].includes(cellOf(r + dr, c + dc))))
    .filter(([r, c]) => (road(r, c - 1) || road(r, c + 1) ? c : r) % 3 === 1);
  // [r, c, vert(도로가 세로로 뻗음), 교차로 여부]
  mapInfo.crosswalks = [...mapInfo.lights.map(([r, c]) => [r, c, false, true]),
                        ...front.map(([r, c]) => [r, c, !(road(r, c - 1) || road(r, c + 1)), false])];
  mapInfo.crossSet = new Set(mapInfo.crosswalks.map(([r, c]) => key(r, c)));
}

function walkPath(a, b) {
  // 가는 길에 도로가 있으면 가까운 횡단보도로 돌아서 건넌다 (무단횡단 금지)
  let crosses = false;
  for (let t = .12; t < .9 && !crosses; t += .04) {
    const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
    crosses = cellOf(Math.floor(y / T), Math.floor(x / T)) === "road";
  }
  if (!crosses || !mapInfo.crosswalks.length) return [b];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const [r, c, vert, inter] = mapInfo.crosswalks.reduce((best, cw) => {
    const d = Math.hypot(cw[1] * T + T / 2 - mx, cw[0] * T + T / 2 - my);
    return !best || d < best.d ? Object.assign([...cw], { d }) : best;
  }, null);
  let p1, p2;
  if (!vert) {      // 가로 도로 → 위아래로 건넌다
    const top = { x: c * T + T / 2, y: r * T - 2 }, bot = { x: c * T + T / 2, y: (r + 1) * T + 2 };
    [p1, p2] = a.y < b.y ? [top, bot] : [bot, top];
  } else {          // 세로 도로 → 좌우로 건넌다
    const L = { x: c * T - 2, y: r * T + T / 2 }, R = { x: (c + 1) * T + 2, y: r * T + T / 2 };
    [p1, p2] = a.x < b.x ? [L, R] : [R, L];
  }
  return [p1, { ...p2, cross: { r, c, vert, inter } }, b];
}

function canWalk(cross) {
  // 교차로는 보행 신호를 지킨다 (건너는 방향의 차가 빨간불일 때만)
  if (!cross.inter) return true;
  const { phase, yellow } = lightState(cross.r, cross.c);
  return !yellow && (cross.vert ? phase === 1 : phase === 0);
}

function roadPath(r, c) {
  // 입구 → (r,c) 도로 칸 중심 좌표 목록
  const pts = [];
  let cur = [r, c];
  while (cur) { pts.push(center(cur[0], cur[1])); cur = roadParent.get(key(cur[0], cur[1])); }
  pts.reverse();
  const [, ec] = game.entrance;
  pts.unshift({ x: ec * T + T / 2, y: N * T + 60 });   // 맵 밖에서 들어온다
  return pts;
}

// 게임 시간 기준 예약 작업 (일시정지하면 같이 멈춘다)
let jobs = [];
const later = (sec, fn) => jobs.push({ t: sec, fn });

// ════════════════════════════════════════════
//  신호등
// ════════════════════════════════════════════
let clock = 0;
function lightState(r, c) {
  // 0: 위아래 초록 / 1: 좌우 초록 (교차로마다 시작 시점이 조금씩 다름)
  const t = clock + ((r * 7 + c * 3) % 10);
  return { phase: Math.floor(t / 6) % 2, yellow: t % 6 > 5 };
}
function redFor(car, p) {
  if (p.r === undefined || !mapInfo.lightSet.has(key(p.r, p.c))) return false;
  const dx = p.x - car.x, dy = p.y - car.y, d = Math.hypot(dx, dy);
  if (d < T / 2 - 1 || d > T / 2 + 8) return false;      // 정지선 근처에서만 멈춘다
  const { phase, yellow } = lightState(p.r, p.c);
  const vertical = Math.abs(dy) > Math.abs(dx);
  return yellow || (vertical ? phase !== 0 : phase !== 1);
}
function mustWait(car, dt) {
  // 빨간불이나 앞차 때문에 멈춘다. 단, 너무 오래 막히면(엉킴 방지) 그냥 지나간다
  const p = car.path[car.i];
  const red = p && redFor(car, p), jam = blocked(car) || yieldTo(car, p);
  if (!red && !jam) { car.stuck = 0; return false; }
  car.stuck = (car.stuck || 0) + dt;
  return car.stuck < (red ? 7 : 3);
}
function yieldTo(car, p) {
  // 다음 칸 횡단보도에 건너는 사람이 있으면 멈춘다
  if (!p || p.r === undefined || !mapInfo.crossSet.has(key(p.r, p.c))) return false;
  if (Math.hypot(p.x - car.x, p.y - car.y) > T * 1.1) return false;
  return people.some(h => h.crossing && h.started && Math.floor(h.x / T) === p.c && Math.floor(h.y / T) === p.r);
}
function blocked(car) {
  // 바로 앞에 같은 방향으로 가는 차가 있으면 기다린다
  const v = { e: [1, 0], w: [-1, 0], s: [0, 1], n: [0, -1] }[car.dir];
  return cars.some(o => {
    if (o === car || o.state === "parked" || o.dir !== car.dir) return false;
    const dx = o.x - car.x, dy = o.y - car.y;
    const ahead = dx * v[0] + dy * v[1], side = Math.abs(dx * v[1] - dy * v[0]);
    return ahead > 0 && ahead < (o.bus || car.bus ? 21 : 15) && side < 6;
  });
}

// ════════════════════════════════════════════
//  자동차 / 승객
// ════════════════════════════════════════════
let cars = [], people = [], popups = [];
let carTimer = 1, popupTimer = 1, incomePot = 0;
const CAR_COLORS = ["#ef5350", "#4f86f7", "#ffffff", "#66bb6a", "#8d6e63", "#263238", "#ab47bc", "#90a4ae"];
const spotTaken = new Set();
// 탑승동 안쪽은 하나로 이어진 대합실: 손님은 어느 탑승동에 온 비행기든 탄다
let airside = 0;
const AIRSIDE_MAX = 40;        // 이보다 많이 쌓이면 다른 항공편을 탄 것으로 처리
const enterAirside = () => { airside = Math.min(AIRSIDE_MAX, airside + 1); };

function moveAlong(o, dt, speedPx) {
  // 경로(o.path)를 따라 이동. 끝나면 true
  let step = speedPx * dt;
  while (step > 0 && o.i < o.path.length) {
    const p = o.path[o.i], dx = p.x - o.x, dy = p.y - o.y, d = Math.hypot(dx, dy);
    if (d > 0.01) o.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "e" : "w") : (dy > 0 ? "s" : "n");
    if (d <= step) { o.x = p.x; o.y = p.y; o.i++; step -= d; }
    else { o.x += dx / d * step; o.y += dy / d * step; step = 0; }
  }
  return o.i >= o.path.length;
}

const spotPos = (pk, i) => pk.garage ? { x: pk.c * T + T / 2, y: pk.r * T + T - 6 }
                                       : { x: pk.c * T + 4 + (i % 4) * 8, y: pk.r * T + (i < 4 ? 6 : 26) };
const doorOf = ([r, c]) => ({ x: c * T + T / 2 + rand(-6, 6), y: r * T + T - 3 });
const nearest = (list, x, y) => list.reduce((b, p) => {
  const q = center(p[0], p[1]), d = Math.hypot(q.x - x, q.y - y);
  return !b || d < b.d ? { p, d } : b;
}, null)?.p;

function toGate() {
  // 셔틀버스가 다니면 터미널에서 버스를 기다린다
  if (cars.some(c => c.bus)) { terminalWaiting = Math.min(60, terminalWaiting + 1); return; }
  // 버스가 없으면 건물 안 통로로 탑승동까지 이동한다 (몇 초 뒤 탑승동 대기열에 나타남)
  later(rand(3, 6), () => {
    if (mapInfo.gates.length) enterAirside();
  });
}

// ── 탑승동 셔틀버스: 터미널 앞 도로 ↔ 탑승동 근처 도로 ──
let terminalWaiting = 0;              // 터미널에서 버스를 기다리는 출발 손님
const gateArrivals = new Map();       // 탑승동 정류장에서 버스를 기다리는 도착 손님

function roadBetween(a, b) {
  // 도로 칸 a → b 경로 (입구 기준 길찾기 트리에서 만나는 지점을 거쳐 간다)
  const chain = ([r, c]) => { const out = []; let cur = [r, c]; while (cur) { out.push(cur); cur = roadParent.get(key(cur[0], cur[1])); } return out; };
  const A = chain(a), B = chain(b);
  const inB = new Map(B.map((p, i) => [key(p[0], p[1]), i]));
  const i = A.findIndex(p => inB.has(key(p[0], p[1])));
  const j = inB.get(key(A[i][0], A[i][1]));
  return [...A.slice(0, i + 1), ...B.slice(0, j).reverse()].map(([r, c]) => center(r, c));
}

function busStops(g) {
  // 탑승동 바로 옆 도로 = 탑승동 정류장, 거기서 가장 가까운 터미널 앞 도로 = 터미널 정류장
  let best = null;
  for (const k of roadParent.keys()) {
    const r = Math.floor(k / 1000), c = k % 1000, d = Math.abs(r - g[0]) + Math.abs(c - g[1]);
    if (!best || d < best.d) best = { r, c, d };
  }
  if (!best || best.d > 1 || !mapInfo.terminalRoads.length) return null;   // 도로가 탑승동에 붙어 있어야 버스가 다님
  const term = mapInfo.terminalRoads.reduce((b, t) => {
    const d = Math.abs(t.road[0] - best.r) + Math.abs(t.road[1] - best.c);
    return !b || d < b.d ? { t, d } : b;
  }, null).t;
  return { gateStop: [best.r, best.c], term };
}

function ensureBuses() {
  // 탑승동마다 버스 한 대씩 자동 운행
  for (const g of mapInfo.gates) {
    const gk = g.join(",");
    if (cars.some(c => c.bus && c.gate === gk)) continue;
    const st = busStops(g);
    if (!st) continue;
    const path = roadPath(st.term.road[0], st.term.road[1]);
    cars.push({ ...path[0], path, i: 0, color: "#1e88e5", bus: true, gate: gk, g, dir: "n", state: "toTerm", load: 0, wait: 0 });
  }
  for (const b of cars) if (b.bus && !mapInfo.gates.some(g => g.join(",") === b.gate)) b.done = true;
}

function updateBus(b, dt) {
  if (b.wait > 0) {                                    // 정류장에서 손님 타고 내리는 중
    b.wait -= dt;
    if (b.wait > 0) return;
    const st = busStops(b.g);
    if (!st) { b.done = true; return; }
    b.path = b.state === "atTerm" ? roadBetween(st.term.road, st.gateStop) : roadBetween(st.gateStop, st.term.road);
    b.i = 0;
    b.state = b.state === "atTerm" ? "toGate" : "toTerm";
    return;
  }
  if (mustWait(b, dt)) return;
  if (!moveAlong(b, dt, 55)) return;
  const st = busStops(b.g);
  if (!st) { b.done = true; return; }
  if (b.state === "toTerm") {
    // 도착 손님 내림 → 터미널로 걸어가서 자기 차/택시
    const d = doorOf([st.term.r, st.term.c]);
    for (let k = 0; k < b.load; k++) later(k * .3, () => spawnPerson(b.x + rand(-6, 6), b.y, d.x, d.y, arrivedPassenger));
    if (b.load) popups.push({ x: b.x, y: b.y - 16, text: `하차 ${b.load}명`, t: 0, plain: true });
    // 출발 손님 태움
    b.load = Math.min(terminalWaiting, 10);
    terminalWaiting -= b.load;
    if (b.load) popups.push({ x: b.x, y: b.y - 28, text: `버스 탑승 ${b.load}명`, t: 0, plain: true });
    b.state = "atTerm"; b.wait = 2.5;
  } else if (b.state === "toGate") {
    // 출발 손님 내림 → 탑승동으로 걸어가서 대기
    const d = doorOf(b.g);
    for (let k = 0; k < b.load; k++)
      later(k * .3, () => spawnPerson(b.x + rand(-6, 6), b.y, d.x, d.y, enterAirside));
    b.load = gateArrivals.get(b.gate) || 0;             // 도착 손님 태움
    gateArrivals.set(b.gate, 0);
    b.state = "atGate"; b.wait = 2.5;
  }
}

function spawnCar() {
  // 출발 손님: 입구로 들어와 주차하고 터미널로 걸어간다
  if (!mapInfo.terminals.length) return;
  const free = [];
  for (const pk of mapInfo.parkings)
    for (let i = 0; i < pk.spots; i++) if (!spotTaken.has(`${pk.r},${pk.c},${i}`)) free.push([pk, i]);
  const color = pick(CAR_COLORS);
  if (free.length) {
    const [pk, i] = pick(free);
    spotTaken.add(`${pk.r},${pk.c},${i}`);
    const path = [...roadPath(pk.road[0], pk.road[1]), spotPos(pk, i)];
    cars.push({ ...path[0], path, i: 0, color, dir: "n", state: "toPark", pk, spot: i });
  } else if (mapInfo.terminalRoads.length) {
    // 주차장이 없으면 터미널 앞에 내려주고 돌아간다
    const t = pick(mapInfo.terminalRoads);
    const path = roadPath(t.road[0], t.road[1]);
    cars.push({ ...path[0], path, i: 0, color, dir: "n", state: "dropoff", term: t });
  }
}

function callTaxi(term) {
  // 도착한 손님을 태우러 오는 택시
  const path = roadPath(term.road[0], term.road[1]);
  cars.push({ ...path[0], path, i: 0, color: "#ffca28", taxi: true, dir: "n", state: "pickup", term });
}

function carLeave(car, fromRoad) {
  car.path = roadPath(fromRoad[0], fromRoad[1]).reverse();
  car.i = 0; car.state = "leaving";
}

function spawnPerson(x, y, tx, ty, onArrive, bag = true) {
  people.push({ x, y, path: walkPath({ x, y }, { x: tx, y: ty }), i: 0, dir: "s", walk: Math.random(), onArrive, bag,
                color: pick(["#ef5350", "#4f86f7", "#43b047", "#ffca28", "#ab47bc", "#ffffff", "#ff8a65"]),
                hair: pick(["#3b2a20", "#6d4c41", "#2b2633", "#d9a441", "#a1887f"]) });
}

function arrivedPassenger() {
  // 비행기에서 내린 손님: 통로를 지나 터미널 앞으로 나와서 자기 차나 택시를 탄다
  later(rand(3, 6), () => {
    const waiting = cars.filter(c => c.state === "parked" && !c.returning);
    if (waiting.length) {
      const car = pick(waiting);
      const t = nearest(mapInfo.terminals, car.x, car.y);
      if (!t) return;
      car.returning = true;
      const d = doorOf(t);
      spawnPerson(d.x, d.y, car.x, car.y + 4, () => { car.state = "unpark"; car.path = [center(car.pk.road[0], car.pk.road[1])]; car.i = 0; });
    } else if (mapInfo.terminalRoads.length && cars.length < 10 + game.effective_planes * 4) callTaxi(pick(mapInfo.terminalRoads));
  });
}

function updateCars(dt) {
  for (const car of cars) {
    if (car.bus) { updateBus(car, dt); continue; }
    if (car.state === "parked") {
      car.wait -= dt;
      if (car.wait <= 0 && !car.returning && mapInfo.terminals.length) {   // 너무 오래 서 있으면 주인이 돌아온다
        car.returning = true;
        const d = doorOf(nearest(mapInfo.terminals, car.x, car.y));
        spawnPerson(d.x, d.y, car.x, car.y + 4, () => { car.state = "unpark"; car.path = [center(car.pk.road[0], car.pk.road[1])]; car.i = 0; });
      }
      continue;
    }
    if (mustWait(car, dt)) continue;   // 빨간불 / 앞차
    if (!moveAlong(car, dt, 70)) continue;
    if (car.state === "toPark") {
      car.state = "parked"; car.dir = car.spot < 4 ? "n" : "s";
      car.wait = rand(60, 120);
      const t = nearest(mapInfo.terminals, car.x, car.y);
      if (t) { const d = doorOf(t); spawnPerson(car.x, car.y + 6, d.x, d.y, toGate); }
    } else if (car.state === "unpark") {
      spotTaken.delete(`${car.pk.r},${car.pk.c},${car.spot}`);
      carLeave(car, car.pk.road);
    } else if (car.state === "dropoff") {
      const d = doorOf([car.term.r, car.term.c]);
      spawnPerson(car.x, car.y, d.x, d.y, toGate);
      carLeave(car, car.term.road);
    } else if (car.state === "pickup") {
      car.state = "waitPickup";
      const d = doorOf([car.term.r, car.term.c]);
      spawnPerson(d.x, d.y, car.x, car.y, () => carLeave(car, car.term.road));
    } else if (car.state === "leaving") car.done = true;
  }
  cars = cars.filter(c => !c.done);
}

function updatePeople(dt) {
  for (const p of people) {
    const nxt = p.path[p.i];
    p.crossing = !!(nxt && nxt.cross);
    if (p.crossing && !p.started) {                       // 횡단보도 앞: 보행 신호 기다리기
      p.waitT = (p.waitT || 0) + dt;
      if (!canWalk(nxt.cross) && p.waitT < 12) continue;
      p.started = true;
    }
    if (!p.crossing) p.started = false;
    p.walk += dt;
    if (moveAlong(p, dt, 24)) { p.done = true; if (p.onArrive) p.onArrive(); }
  }
  people = people.filter(p => !p.done);
}

// ════════════════════════════════════════════
//  비행기: 격납고 → 이륙 차선 → 탑승동에서 손님 태움 → 이륙
//          → 착륙 차선 → 탑승동에서 손님 내림 → 격납고
// ════════════════════════════════════════════
let fleet = [], cruises = [], cruiseTimer = 4;
const LIVERIES = ["sky", "rainbow", "red"];
const SEATS = { light: 2, mid: 4, jumbo: 8 };
const SIZE = { light: 0, mid: 1, jumbo: 2 };   // 비행기 크기 (격납고도 같은 기준)
const laneLock = new Map();   // "활주로:차선" → 사용 중인 비행기 (한 차선에 한 대만)
const gateBusy = new Map();   // 탑승동 → 붙어 있는 비행기 (탑승동 하나에 한 대만)

const stripLen = ([r0, c0, r1, c1]) => Math.max(r1 - r0, c1 - c0) + 1;
const validStripOf = (r, c) => game.valid_runways.find(([r0, c0, r1, c1]) => r >= r0 && r <= r1 && c >= c0 && c <= c1);

function routeFor(p) {
  // 격납고 옆 활주로, 같은 활주로에 붙은 탑승동, 차선 위치 계산
  for (const [dr, dc] of DIRS) {
    const rr = p.hangar[0] + dr, rc = p.hangar[1] + dc;
    if (cellOf(rr, rc) !== "runway") continue;
    const s = validStripOf(rr, rc);
    if (!s) continue;
    const [r0, c0, r1, c1] = s, horiz = r0 === r1;
    const along = (r, c) => horiz ? c * T + T / 2 : r * T + T / 2;
    let gate = null, best = 1e9;
    for (const g of mapInfo.gates) for (const [gr, gc] of DIRS.map(([a, b]) => [g[0] + a, g[1] + b])) {
      if (gr < r0 || gr > r1 || gc < c0 || gc > c1) continue;
      const busy = gateBusy.get(g.join(","));
      if (busy && busy !== p) continue;                   // 다른 비행기가 붙어 있는 탑승동은 건너뜀
      const dist = Math.abs(along(gr, gc) - along(rr, rc));
      if (dist < best) { best = dist; gate = { cell: g, stop: along(gr, gc) }; }
    }
    if (!gate) return null;                                 // 탑승동이 없으면 못 뜬다
    const R = center(rr, rc);
    return { id: s.join(","), horiz, len: stripLen(s), H: center(p.hangar[0], p.hangar[1]), stop: along(rr, rc),
             gate, lane0: horiz ? R.y - 7 : R.x + 7, lane1: horiz ? R.y + 7 : R.x - 7,
             end: horiz ? (c1 + 1) * T : (r1 + 1) * T };
  }
  return null;
}

const P = (route, along, lane) => route.horiz ? { x: along, y: route[lane] } : { x: route[lane], y: along };
const seg = (from, to, dur, ease = "lin", alt0 = 0, alt1 = 0, onEnd = null) => ({ from, to, dur: Math.max(.05, dur), ease, alt0, alt1, onEnd });

function syncFleet() {
  // 서버의 종류별 보유 대수/격납고와 화면의 비행기를 맞춘다 (비행기는 크기에 맞는 격납고에)
  const hs = mapInfo.hangars;
  const exists = new Set(hs.map(h => h.cell.join(",")));
  fleet = fleet.filter(p => exists.has(p.hangar.join(",")) || p.state === "away");
  for (const type of ["jumbo", "mid", "light"]) {
    const mine = fleet.filter(p => p.type === type);
    while (mine.length > game.fleet[type]) fleet.splice(fleet.indexOf(mine.pop()), 1);
    const used = new Set(fleet.map(p => p.hangar.join(",")));
    while (mine.length < game.fleet[type]) {
      const h = hs.filter(x => !used.has(x.cell.join(",")) && x.size >= SIZE[type]).sort((a, b) => a.size - b.size)[0];
      if (!h) break;
      used.add(h.cell.join(","));
      const p = { type, hangar: h.cell, hangarKind: h.kind, livery: pick(LIVERIES), state: "parked",
                  wait: rand(1, 4), segs: [], t: 0, dir: "e", x: 0, y: 0, alt: 0 };
      fleet.push(p); mine.push(p);
    }
  }
  for (const [k, v] of laneLock) if (!fleet.includes(v)) laneLock.delete(k);   // 사라진 비행기의 차선 해제
  for (const [k, v] of gateBusy) if (!fleet.includes(v)) gateBusy.delete(k);
}

function board(p, gateCell) {
  // 대합실 손님이 탑승동 문에서 비행기까지 걸어가서 탄다
  const n = Math.min(airside, SEATS[p.type]);
  airside -= n;
  if (!n) return;
  popups.push({ x: p.x, y: p.y - 20, text: `탑승 ${n}명`, t: 0, plain: true });
  const d = doorOf(gateCell);
  for (let k = 0; k < Math.min(n, 4); k++)
    later(k * .35, () => spawnPerson(d.x + rand(-4, 4), d.y, p.x + rand(-4, 4), p.y, null));
}

function deboard(p, gateCell) {
  const n = SEATS[p.type], gk = gateCell.join(",");
  popups.push({ x: p.x, y: p.y - 20, text: `도착 ${n}명`, t: 0, plain: true });
  const st = cars.some(c => c.bus && c.gate === gk) && busStops(gateCell);
  for (let k = 0; k < Math.ceil(n / 2); k++) {
    if (!st) { arrivedPassenger(); continue; }
    const d = doorOf(gateCell), stop = center(...st.gateStop);
    later(1 + k * .4, () => spawnPerson(d.x, d.y, stop.x + rand(-8, 8), stop.y + rand(-4, 4),
                                         () => gateArrivals.set(gk, (gateArrivals.get(gk) || 0) + 1)));
  }
}

function takeoff(p, route) {
  const lock = route.id + ":0";            // 이륙 활주 구간만 한 대씩 (탑승은 여러 대가 동시에)
  const out = P(route, route.stop, "lane0"), atGate = P(route, route.gate.stop, "lane0");
  const endP = P(route, route.end, "lane0"), far = P(route, route.end + 700, "lane0");
  const roll = Math.abs(route.end - route.gate.stop), gk = route.gate.cell.join(",");
  gateBusy.set(gk, p);
  p.segs = [
    seg(route.H, out, 1.6),
    seg(out, atGate, Math.abs(route.gate.stop - route.stop) / 45 + .2, "lin", 0, 0, () => board(p, route.gate.cell)),
    seg(atGate, atGate, 2.2, "lin", 0, 0, () => gateBusy.delete(gk)),   // 탑승
    { ...seg(atGate, endP, Math.max(1.4, Math.sqrt(roll / 40)), "in", 0, 0, () => laneLock.delete(lock)), lock },   // 바퀴가 뜨면 차선 비움
    seg(endP, far, 4, "lin", 0, 160),
  ];
  p.t = 0; p.state = "takeoff";
  return true;
}

function landing(p, route) {
  const lock = route.id + ":1";
  if (laneLock.has(lock)) return false;
  laneLock.set(lock, p);
  const far = P(route, route.end + 650, "lane1"), td = P(route, route.end, "lane1");
  const atGate = P(route, route.gate.stop, "lane1"), back = P(route, route.stop, "lane1");
  const gk = route.gate.cell.join(",");
  gateBusy.set(gk, p);
  p.segs = [
    seg(far, td, 4, "lin", 160, 0),
    seg(td, atGate, Math.max(1.2, Math.sqrt(Math.abs(route.end - route.gate.stop) / 30)), "out", 0, 0, () => deboard(p, route.gate.cell)),
    seg(atGate, atGate, 2.2, "lin", 0, 0, () => gateBusy.delete(gk)),   // 하차
    seg(atGate, back, Math.abs(route.gate.stop - route.stop) / 45 + .2, "lin", 0, 0, () => laneLock.delete(lock)),
    seg(back, route.H, 1.6),
  ];
  p.t = 0; p.state = "landing";
  return true;
}

function updateFleet(dt) {
  syncFleet();
  const active = { light: 0, mid: 0, jumbo: 0 };
  for (const p of fleet) if (p.state !== "parked") active[p.type]++;
  for (const p of fleet) {
    if (p.state === "parked" || p.state === "away") {
      p.wait -= dt;
      if (p.wait > 0) continue;
      const route = routeFor(p);
      const longEnough = p.type !== "jumbo" || (route && route.len >= 12);
      if (p.state === "parked") {
        if (route && longEnough && game.can_fly && active[p.type] < game.operating[p.type] && takeoff(p, route)) active[p.type]++;
        else p.wait = rand(1, 3);
      } else if (!route) { p.state = "parked"; p.wait = 3; }
      else if (!landing(p, route)) p.wait = rand(1, 2);
      continue;
    }
    // 활주로를 써야 하는 구간이면 차선이 빌 때까지 기다린다
    const cur = p.segs[0];
    if (cur && cur.lock && !cur.got) {
      if (laneLock.has(cur.lock) && laneLock.get(cur.lock) !== p) continue;
      laneLock.set(cur.lock, p);
      cur.got = true;
    }
    // 구간 이동
    p.t += dt;
    let s = p.segs[0];
    while (s && p.t >= s.dur) {
      p.t -= s.dur;
      p.x = s.to.x; p.y = s.to.y;
      if (s.onEnd) s.onEnd();
      p.segs.shift();
      s = p.segs[0];
    }
    if (!s) {
      if (p.state === "takeoff") { p.state = "away"; p.wait = rand(6, 14); }
      else { p.state = "parked"; p.wait = rand(3, 8); }
      continue;
    }
    let u = p.t / s.dur;
    if (s.ease === "in") u = u * u;
    if (s.ease === "out") u = 1 - (1 - u) * (1 - u);
    const dx = s.to.x - s.from.x, dy = s.to.y - s.from.y;
    p.x = s.from.x + dx * u; p.y = s.from.y + dy * u;
    p.alt = s.alt0 + (s.alt1 - s.alt0) * u;
    if (Math.hypot(dx, dy) > 1) p.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "e" : "w") : (dy > 0 ? "s" : "n");
  }
}

function updateCruises(dt) {
  cruiseTimer -= dt;
  if (cruiseTimer <= 0) {
    cruiseTimer = rand(10, 20);
    const [dir, d] = pick([["e", [1, 0]], ["w", [-1, 0]], ["s", [0, 1]], ["n", [0, -1]]]);
    const lane = rand(100, N * T - 100);
    const x = d[0] ? (d[0] > 0 ? -80 : N * T + 80) : lane, y = d[1] ? (d[1] > 0 ? -80 : N * T + 80) : lane;
    cruises.push({ x, y, d, dir, type: pick(["mid", "jumbo"]), livery: pick(LIVERIES), alt: 220 });
  }
  for (const c of cruises) { c.x += c.d[0] * 110 * dt; c.y += c.d[1] * 110 * dt; }
  cruises = cruises.filter(c => c.x > -120 && c.x < N * T + 120 && c.y > -120 && c.y < N * T + 120);
}

// ════════════════════════════════════════════
//  업데이트 / 그리기
// ════════════════════════════════════════════
let busTimer = 0;
function update(dt) {
  clock += dt;
  busTimer -= dt;
  if (busTimer <= 0) { busTimer = 1; ensureBuses(); }
  for (const j of jobs) { j.t -= dt; if (j.t <= 0) { j.done = true; j.fn(); } }
  jobs = jobs.filter(j => !j.done);
  updateFleet(dt);
  updateCruises(dt);
  updateCars(dt);
  updatePeople(dt);

  const eff = game.effective_planes;
  carTimer -= dt;
  if (carTimer <= 0) {
    carTimer = (game.is_day ? 2.5 : 6) / Math.sqrt(eff + 1);
    if (eff > 0 && cars.length < 6 + eff * 4) spawnCar();
  }
  // 수익 팝업: 실제 수입만큼 쌓였다가 건물 위로 튀어나온다
  incomePot += game.income_per_sec * dt;
  popupTimer -= dt;
  if (popupTimer <= 0) {
    popupTimer = 1.2;
    const earners = [...mapInfo.terminals, ...mapInfo.shops];
    if (incomePot >= 1 && earners.length) {
      const v = Math.floor(incomePot);
      incomePot -= v;
      const [r, c] = pick(earners);
      popups.push({ x: c * T + T / 2, y: r * T - 10, text: `+${v}`, t: 0 });
    }
  }
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 1.4);
}

function drawStatic() {
  const k = JSON.stringify(game.tiles) + game.is_day;
  if (k === staticKey) return;
  staticKey = k;
  staticLayer.width = staticLayer.height = N * T;
  const g = staticLayer.getContext("2d");
  g.imageSmoothingEnabled = false;
  // 1) 바닥 전부  2) 물체를 위쪽 줄부터: 아래 줄 건물이 뒤 건물을 자연스럽게 가린다
  game.tiles.forEach((row, r) => row.forEach(([gk], c) => g.drawImage(spr(gk), c * T, r * T)));
  game.tiles.forEach((row, r) => row.forEach(([, ok], c) => { if (ok) drawObject(g, ok, r, c); }));
}

function drawObject(g, k, r, c, alpha = 1) {
  const img = spr(k);
  g.globalAlpha = alpha;
  g.drawImage(img, c * T, (r + 1) * T - img.height);
  g.globalAlpha = 1;
}

function drawCentered(k, x, y, alpha = 1) {
  const img = spr(k);
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2));
  ctx.globalAlpha = 1;
}

function drawCar(car) {
  const vert = car.dir === "n" || car.dir === "s";
  const len = car.bus ? 18 : 12, wid = car.bus ? 9 : 8;
  const w = vert ? wid : len, h = vert ? len : wid;
  // 오른쪽 차선으로 달리기
  const off = car.state === "parked" ? [0, 0] : { e: [0, 5], w: [0, -5], n: [5, 0], s: [-5, 0] }[car.dir];
  const x = Math.round(car.x + off[0] - w / 2), y = Math.round(car.y + off[1] - h / 2);
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(x + 1, y + 2, w, h);
  ctx.fillStyle = "#2b2633"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = car.color; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = night() ? "#ffe9a8" : "#bfe6ff";      // 앞유리 (밤엔 불빛)
  const glass = { n: [x + 2, y + 2, w - 4, 2], s: [x + 2, y + h - 4, w - 4, 2], e: [x + w - 4, y + 2, 2, h - 4], w: [x + 2, y + 2, 2, h - 4] }[car.dir];
  ctx.fillRect(...glass);
  ctx.fillStyle = "rgba(255,255,255,.35)";
  ctx.fillRect(x + 1, y + 1, w - 2, 1);
  if (car.taxi) { ctx.fillStyle = "#2b2633"; ctx.fillRect(x + w / 2 - 2, y + h / 2 - 1, 4, 2); }   // 택시 표시등
  if (car.bus) {                                                   // 버스 옆 창문 줄 + 흰 띠
    ctx.fillStyle = night() ? "#ffe9a8" : "#bfe6ff";
    for (let k = 4; k < len - 4; k += 3) {
      if (vert) { ctx.fillRect(x + 1, y + k, 1, 2); ctx.fillRect(x + w - 2, y + k, 1, 2); }
      else { ctx.fillRect(x + k, y + 1, 2, 1); ctx.fillRect(x + k, y + h - 2, 2, 1); }
    }
    ctx.fillStyle = "#ffffff";
    if (vert) ctx.fillRect(x + w / 2 - 1, y + 3, 2, h - 6); else ctx.fillRect(x + 3, y + h / 2 - 1, w - 6, 2);
  }
}

function drawPerson(p, standing = false) {
  const x = Math.round(p.x) - 4, y = Math.round(p.y) - 15, step = standing ? 0 : Math.floor(p.walk * 7) % 2;
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(x + 1, y + 14, 7, 2);           // 그림자
  ctx.fillStyle = "#2b2633"; ctx.fillRect(x, y, 9, 8); ctx.fillRect(x + 1, y + 8, 7, 7);  // 외곽선
  ctx.fillStyle = p.hair; ctx.fillRect(x + 1, y + 1, 7, 3);                        // 머리카락
  ctx.fillStyle = "#ffd9b3"; ctx.fillRect(x + 1, y + 3, 7, 4);                     // 얼굴
  ctx.fillStyle = p.hair; ctx.fillRect(x + 1, y + 3, 1, 2); ctx.fillRect(x + 7, y + 3, 1, 2);
  if (p.dir !== "n") {
    ctx.fillStyle = "#2b2633"; ctx.fillRect(x + 3, y + 4, 1, 2); ctx.fillRect(x + 6, y + 4, 1, 2);  // 눈
    ctx.fillStyle = "#ff9e9e"; ctx.fillRect(x + 2, y + 6, 1, 1); ctx.fillRect(x + 7, y + 6, 1, 1);  // 볼
  }
  ctx.fillStyle = p.color; ctx.fillRect(x + 2, y + 8, 5, 4);                       // 옷
  ctx.fillStyle = "rgba(0,0,0,.15)"; ctx.fillRect(x + 5, y + 8, 2, 4);
  ctx.fillStyle = "#ffd9b3"; ctx.fillRect(x + 1, y + 9 + step, 1, 2); ctx.fillRect(x + 7, y + 10 - step, 1, 2);  // 팔
  ctx.fillStyle = "#3a3f55"; ctx.fillRect(x + 2 + step * 3, y + 12, 2, 3); ctx.fillRect(x + 5 - step * 3, y + 12, 2, 2);  // 다리
  if (p.bag) {                                                                     // 캐리어
    ctx.fillStyle = "#2b2633"; ctx.fillRect(x + 9, y + 8, 5, 7);
    ctx.fillStyle = "#ffb74d"; ctx.fillRect(x + 10, y + 9, 3, 5);
    ctx.fillStyle = "#2b2633"; ctx.fillRect(x + 11, y + 6, 1, 2);
  }
}

const QUEUE_LOOKS = [["#ef5350", "#3b2a20"], ["#4f86f7", "#6d4c41"], ["#43b047", "#2b2633"], ["#ffca28", "#d9a441"], ["#ab47bc", "#3b2a20"], ["#ffffff", "#a1887f"]];

function drawTrafficLight(x, y, on, yellow) {
  ctx.fillStyle = "#2b2633"; ctx.fillRect(x, y, 5, 10); ctx.fillRect(x + 2, y + 10, 1, 4);
  ctx.fillStyle = !on && !yellow ? "#ff3b3b" : "#4a2020"; ctx.fillRect(x + 1, y + 1, 3, 2);
  ctx.fillStyle = yellow ? "#ffd54a" : "#4a4020"; ctx.fillRect(x + 1, y + 4, 3, 2);
  ctx.fillStyle = on && !yellow ? "#4cff7a" : "#1f4a2a"; ctx.fillRect(x + 1, y + 7, 3, 2);
}

function draw(now) {
  const W = canvas.width, H = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = night() ? "#0d1426" : "#4c7f3a";
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(cam.zoom, 0, 0, cam.zoom, -cam.x * cam.zoom, -cam.y * cam.zoom);

  drawStatic();
  ctx.drawImage(staticLayer, 0, 0);

  // 공항 입구 표지
  const [, ec] = game.entrance;
  ctx.fillStyle = "#2b2633"; ctx.fillRect(ec * T - 26, N * T + 4, 84, 18);
  ctx.fillStyle = "#ffd166"; ctx.font = "bold 12px 'Malgun Gothic', sans-serif"; ctx.textAlign = "center";
  ctx.fillText("✈ 공항 입구", ec * T + T / 2, N * T + 17);
  ctx.fillStyle = "#5c5f6b"; ctx.fillRect(ec * T, N * T, T, 4);

  // 설치 안내: 반짝이는 칸
  const pulse = .35 + .25 * Math.sin(now / 180);
  let hint = "", warn = false;
  if (game.build_ok[tool]) {
    const ok = game.build_ok[tool];
    for (const [r, c] of ok) {
      ctx.fillStyle = `rgba(255, 214, 90, ${pulse})`;
      ctx.fillRect(c * T + 1, r * T + 1, T - 2, T - 2);
      ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2;
      ctx.strokeRect(c * T + 2, r * T + 2, T - 4, T - 4);
    }
    const name = game.tools.find(t => t.key === tool).name;
    const fits = { hangar_light: " · 경비행기용", hangar: " · 경비행기/여객기용", hangar_jumbo: " · 모든 비행기 (대형 여객기는 여기만)" }[tool] || "";
    hint = ok.length ? `✨ 반짝이는 칸에 ${name}을 설치하세요 (활주로 옆)${fits}` : `${name}은 활주로 옆에만 지을 수 있어요. 활주로부터 깔아주세요!`;
  } else if (tool.startsWith("zone_")) {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (game.grid[r][c] !== "empty") continue;
      if (!DIRS.some(([dr, dc]) => roadParent.has(key(r + dr, c + dc)))) continue;
      ctx.fillStyle = `rgba(110, 168, 255, ${pulse * .6})`;
      ctx.fillRect(c * T + 2, r * T + 2, T - 4, T - 4);
    }
    hint = "도로와 맞닿은 칸에 구역을 칠하면 건물이 올라와요";
  } else if (tool === "land") {
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (game.grid[r][c] !== null) continue;
      if (DIRS.some(([dr, dc]) => cellOf(r + dr, c + dc) != null)) ctx.strokeRect(c * T + 3.5, r * T + 3.5, T - 7, T - 7);
    }
    ctx.setLineDash([]);
    hint = "점선 칸을 눌러 땅을 사세요 (입구에서 멀수록 비쌈)";
  } else if (tool === "runway") hint = "활주로는 한 줄로 8칸 이상 이어야 비행기가 떠요 (대형 여객기는 12칸)";
  if (game.status) { hint = "⚠ " + game.status + (hint ? " · " + hint : ""); warn = true; }
  $("hint").textContent = hint;
  $("hint").classList.toggle("hidden", !hint);
  $("hint").classList.toggle("warn", warn);

  // 도로 연결 안 된 구역 경고
  if (Math.floor(now / 400) % 2) for (const [r, c] of game.no_road) {
    ctx.fillStyle = "#2b2633"; ctx.fillRect(c * T + 10, r * T - 4, 12, 14);
    ctx.fillStyle = "#ff6b6b"; ctx.fillRect(c * T + 11, r * T - 3, 10, 12);
    ctx.fillStyle = "#fff"; ctx.fillRect(c * T + 15, r * T - 1, 2, 5); ctx.fillRect(c * T + 15, r * T + 6, 2, 2);
  }

  // 횡단보도 (흰 줄무늬)
  ctx.fillStyle = night() ? "#9aa3b8" : "#f4f4f4";
  for (const [r, c, vert, inter] of mapInfo.crosswalks) {
    const x0 = c * T, y0 = r * T;
    if (inter) {                                          // 교차로: 네 변에
      for (let k = 6; k < 26; k += 4) {
        ctx.fillRect(x0 + k, y0 + 1, 2, 5); ctx.fillRect(x0 + k, y0 + T - 6, 2, 5);
        ctx.fillRect(x0 + 1, y0 + k, 5, 2); ctx.fillRect(x0 + T - 6, y0 + k, 5, 2);
      }
    } else if (!vert) for (let k = 3; k < 29; k += 4) ctx.fillRect(x0 + 10, y0 + k, 12, 2);
    else for (let k = 3; k < 29; k += 4) ctx.fillRect(x0 + k, y0 + 10, 2, 12);
  }

  // 신호등 (삼거리 이상)
  for (const [r, c] of mapInfo.lights) {
    const { phase, yellow } = lightState(r, c);
    drawTrafficLight(c * T + 1, r * T - 6, phase === 0, yellow);          // 위아래 방향 신호
    drawTrafficLight(c * T + T - 6, r * T + T - 14, phase === 1, yellow); // 좌우 방향 신호
  }

  // 격납고에 들어가 있는 비행기 → 문 닫힌 격납고
  for (const p of fleet) if (p.state === "parked") drawObject(ctx, `${p.hangarKind}_closed`, p.hangar[0], p.hangar[1]);

  // 탑승동 앞에서 기다리는 손님
  const perGate = mapInfo.gates.length ? Math.ceil(airside / mapInfo.gates.length) : 0;
  for (const [r, c] of mapInfo.gates) {
    for (let i = 0; i < Math.min(perGate, 6); i++) {
      const [color, hair] = QUEUE_LOOKS[i];
      drawPerson({ x: c * T + 5 + i * 4.5, y: r * T + T - 1, color, hair, dir: "s", walk: 0, bag: false }, true);
    }
  }

  // 탑승동 정류장에서 버스를 기다리는 손님
  for (const [gk, n] of gateArrivals) {
    if (!n) continue;
    const st = busStops(gk.split(",").map(Number));
    if (!st) continue;
    const s0 = center(...st.gateStop);
    for (let i = 0; i < Math.min(n, 5); i++) {
      const [color, hair] = QUEUE_LOOKS[i];
      drawPerson({ x: s0.x - 10 + i * 5, y: s0.y + 13, color, hair, dir: "s", walk: 0, bag: true }, true);
    }
  }

  // 땅 위 움직이는 것들 (아래쪽에 있는 것부터)
  const ground = [...cars.map(o => ["car", o]), ...people.map(o => ["person", o]),
                  ...fleet.filter(p => p.state !== "parked" && p.state !== "away" && p.alt < 1).map(o => ["plane", o])]
                 .sort((a, b) => a[1].y - b[1].y);
  for (const [kind, o] of ground) {
    if (kind === "car") { if (!(o.state === "parked" && o.pk && o.pk.garage)) drawCar(o); }
    else if (kind === "person") drawPerson(o);
    else drawCentered(`${o.type}_${o.livery}_${o.dir}`, o.x, o.y);
  }

  // 하늘의 비행기: 그림자 먼저, 그 위에 비행기
  const air = [...fleet.filter(p => (p.state === "takeoff" || p.state === "landing") && p.alt >= 1), ...cruises];
  for (const p of air) drawCentered(`${p.type}shadow_${p.dir}`, p.x + p.alt * .25, p.y + p.alt * .15, .5);
  for (const p of air) drawCentered(`${p.type}_${p.livery}_${p.dir}`, p.x, p.y - p.alt * .5);

  // 팝업 (수익 동전 / 탑승 인원)
  ctx.font = "bold 13px 'Malgun Gothic', sans-serif";
  for (const p of popups) {
    const y = Math.round(p.y - p.t * 22);
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.4);
    ctx.lineWidth = 3; ctx.strokeStyle = "#2b2633";
    if (p.plain) {
      ctx.textAlign = "center";
      ctx.strokeText(p.text, p.x, y);
      ctx.fillStyle = "#bfe6ff"; ctx.fillText(p.text, p.x, y);
      continue;
    }
    ctx.textAlign = "left";
    ctx.fillStyle = "#2b2633"; ctx.fillRect(p.x - 14, y - 11, 11, 11);
    ctx.fillStyle = "#ffca28"; ctx.fillRect(p.x - 13, y - 10, 9, 9);
    ctx.fillStyle = "#fff59d"; ctx.fillRect(p.x - 11, y - 8, 2, 5);
    ctx.strokeText(p.text, p.x, y);
    ctx.fillStyle = "#ffe066"; ctx.fillText(p.text, p.x, y);
  }
  ctx.globalAlpha = 1;

  // 마우스 위치 미리보기
  if (hoverCell) {
    const [r, c] = hoverCell;
    if (game.grid[r][c] === "empty" && game.tools.some(t => t.key === tool)) {
      const prev = { road: "road5", runway: "runway_h", gate: "gate_n" }[tool] || tool;
      if (SP.sprites[prev].length > T) drawObject(ctx, prev, r, c, .7);
      else { ctx.globalAlpha = .7; ctx.drawImage(spr(prev), c * T, r * T); ctx.globalAlpha = 1; }
    }
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.strokeRect(c * T + 1, r * T + 1, T - 2, T - 2);
  }
}

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - lastFrame) / 1000);
  lastFrame = now;
  if (game && !$("game").classList.contains("hidden")) {
    panKeys(dt);
    if (!paused && !modalOpen) update(dt * speed);
    draw(now);
  }
  requestAnimationFrame(frame);
}

// ════════════════════════════════════════════
//  카메라 / 입력
// ════════════════════════════════════════════
function clampCam() {
  const vw = canvas.width / cam.zoom, vh = canvas.height / cam.zoom;
  cam.x = Math.max(-80, Math.min(N * T - vw + 80, cam.x));
  cam.y = Math.max(-80, Math.min(N * T - vh + 80, cam.y));
}

function toWorld(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * canvas.width;
  const sy = (e.clientY - rect.top) / rect.height * canvas.height;
  return { x: sx / cam.zoom + cam.x, y: sy / cam.zoom + cam.y, sx, sy };
}

function cellAt(e) {
  const w = toWorld(e), c = Math.floor(w.x / T), r = Math.floor(w.y / T);
  return inMap(r, c) ? [r, c] : null;
}

let painting = false, panning = null, lastCell = null, hoverCell = null;
let mouse = { x: 0, y: 0, w: 1, h: 1, inside: false };
const keys = new Set();

async function act(cell, quiet) {
  const [r, c] = cell;
  const body = { id: gameId, r, c, quiet };
  if (tool === "land") body.type = "land";
  else if (tool === "demolish") body.type = "demolish";
  else { body.type = "build"; body.zone = tool; }
  apply(await api("/api/action", body));
}

canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  if (!game || modalOpen) return;
  if (e.button === 2 || e.button === 1 || tool === "move") { panning = { x: e.clientX, y: e.clientY }; canvas.style.cursor = "grabbing"; return; }
  const cell = cellAt(e);
  if (!cell) return;
  painting = true; lastCell = cell.join();
  act(cell, false);
});
canvas.addEventListener("pointermove", e => {
  if (!game) return;
  const rect = canvas.getBoundingClientRect();
  mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top, w: rect.width, h: rect.height, inside: true };
  if (panning) {
    const rect = canvas.getBoundingClientRect(), s = canvas.width / rect.width / cam.zoom;
    cam.x -= (e.clientX - panning.x) * s; cam.y -= (e.clientY - panning.y) * s;
    panning = { x: e.clientX, y: e.clientY };
    clampCam();
    return;
  }
  const cell = cellAt(e);
  hoverCell = cell;
  if (!cell) return;
  describe(cell);
  if (painting && cell.join() !== lastCell) {   // 드래그로 여러 칸 짓기
    lastCell = cell.join();
    act(cell, true);
  }
});
canvas.addEventListener("pointerleave", () => { hoverCell = null; mouse.inside = false; $("tip").classList.add("hidden"); });
window.addEventListener("pointerup", () => { painting = false; panning = null; canvas.style.cursor = tool === "move" ? "grab" : "crosshair"; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const w = toWorld(e), zooms = [.5, .75, 1, 1.5, 2];
  let i = zooms.indexOf(cam.zoom);
  i = Math.max(0, Math.min(zooms.length - 1, i + (e.deltaY < 0 ? 1 : -1)));
  cam.zoom = zooms[i];
  cam.x = w.x - w.sx / cam.zoom; cam.y = w.y - w.sy / cam.zoom;   // 마우스 위치 기준으로 확대
  clampCam();
}, { passive: false });
window.addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
function panKeys(dt) {
  const v = 500 * dt / cam.zoom;
  // 마우스를 화면 가장자리에 대면 그쪽으로 스크롤
  if (mouse.inside && !painting && !panning && !modalOpen) {
    const edge = 28;
    if (mouse.x < edge) cam.x -= v;
    if (mouse.x > mouse.w - edge) cam.x += v;
    if (mouse.y < edge) cam.y -= v;
    if (mouse.y > mouse.h - edge) cam.y += v;
  }
  if (keys.has("a") || keys.has("arrowleft")) cam.x -= v;
  if (keys.has("d") || keys.has("arrowright")) cam.x += v;
  if (keys.has("w") || keys.has("arrowup")) cam.y -= v;
  if (keys.has("s") || keys.has("arrowdown")) cam.y += v;
  clampCam();
}

function describe([r, c]) {
  const v = game.grid[r][c], lv = game.levels[r][c];
  const info = game.tools.find(t => t.key === v);
  let text;
  if (v === null) text = `미구매 땅 · ${money(game.land_prices[r][c])}`;
  else if (v === "empty") text = "빈 땅";
  else if (v.startsWith("zone_")) {
    const building = game.building.some(([br, bc]) => br === r && bc === c);
    const noRoad = game.no_road.some(([br, bc]) => br === r && bc === c);
    text = `${info ? info.name : v} · ` + (noRoad ? "⚠ 도로 연결 필요!" : lv <= 0 ? (building ? "공사 중..." : "수요 대기 중") : `Lv${lv}` + (building ? " (확장 공사 중)" : ""));
  } else if (v === "gate") text = `탑승동 · 대합실 손님 ${airside}명 (모든 탑승동 공용) · ` +
      (busStops([r, c]) ? "🚌 셔틀버스 운행 중" : "도로를 탑승동 옆까지 이어주면 셔틀버스가 다녀요");
  else text = info ? info.name : v;
  $("hover").textContent = text;

  // 빨간 느낌표가 뜬 칸이면 이유를 말풍선으로
  const tip = $("tip");
  if (game.no_road.some(([br, bc]) => br === r && bc === c)) {
    tip.innerHTML = `<b>⚠ 도로와 연결되지 않았어요</b><br>${info ? info.name : "구역"}은 <b>입구에서 이어진 도로</b> 바로 옆에 있어야 건물이 올라와요.<br>도로 도구로 이 칸까지 길을 이어주세요.`;
    const box = $("mapBox").getBoundingClientRect(), rect = canvas.getBoundingClientRect();
    tip.style.left = Math.min(rect.left - box.left + mouse.x + 14, box.width - 270) + "px";
    tip.style.top = (rect.top - box.top + mouse.y + 14) + "px";
    tip.classList.remove("hidden");
  } else tip.classList.add("hidden");
}

$("btnPause").onclick = () => { paused = !paused; renderPanel(); };
$("btnSpeed").onclick = () => { speed = speed === 1 ? 2 : 1; renderPanel(); };

// ════════════════════════════════════════════
//  팝업
// ════════════════════════════════════════════
function alertModal(title, text, onClose) {
  modalQueue.push({ title, text, onClose });
  if (!modalOpen) nextModal();
}
function nextModal() {
  const m = modalQueue.shift();
  if (!m) { modalOpen = false; $("modal").classList.add("hidden"); return; }
  modalOpen = true;
  $("modalTitle").textContent = m.title;
  $("modalText").textContent = m.text;
  $("modal").classList.remove("hidden");
  $("modalOk").onclick = () => { nextModal(); if (m.onClose) m.onClose(); };
}

(async () => {
  SP = await api("/api/sprites");
  buildSprites();
  requestAnimationFrame(frame);
  showStart();
})();
</script>
</body>
</html>
