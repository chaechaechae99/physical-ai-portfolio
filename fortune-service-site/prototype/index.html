<title>운결 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ungyeol-theme')==='dark'?'dark':'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<style>
/* Layout: 새벽하늘 — 흰 바탕 + 네이비 헤더·큰 카드, 하늘색 하이라이트, 금색 아이콘, 일반/다크 토글 + 섹션별 카드 그리드(운세=큰 카드, 신비=테두리 작은 카드), 최대폭 1080px. 신한라이프식 — 단색 히어로 + 섹션별 카드 그리드(진지=큰 컬러 카드, 재미=테두리 작은 카드), 최대폭 1080px */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#13202E; --muted:#5E6E7E; --line:#DDE7F0; --line-hi:#B9CCDD;
  --primary:#1B3A5C; --primary-hi:#234A73; --on-primary:#FFFFFF; --card-line:#1B3A5C; --gold:#C9A24B; --gold-text:#8A6A1F; --soft:#EEF5FB; --bar:#8FB8DC;
  --accent:#4FA3E0; --accent-text:#2F7FBF; --accent-on:#0D1724;
  --btn-bg:#1B3A5C; --btn-ink:#FFFFFF; --btn-hi:#234A73;
  --hdr-bg:#1B3A5C; --hdr-ink:#FFFFFF; --hdr-line:#1B3A5C; --hdr-soft:#234A73; --hdr-field:#16314E; --hdr-field-line:#3D5F85;
  --wood:#3E8E5A; --fire:#D0493B; --earth:#B07F1E; --metal:#7D8494; --water:#2F5DA8;
  --good:#2F8F5B; --bad:#C2453A; --mid:#8A7B2E; color-scheme:light;
  --display:"Gowun Batang",ui-serif,"Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
/* 일반모드가 기본(시스템 설정을 따르지 않음). 헤더의 토글이 data-theme을 바꾼다. */
:root[data-theme="dark"]{
  --bg:#0D1724; --surface:#142235; --ink:#E8F0F7; --muted:#9AABBD; --line:#26394F; --line-hi:#34506E;
  --primary:#1B3A5C; --primary-hi:#234A73; --on-primary:#FFFFFF; --card-line:#26394F; --gold:#D9B45E; --gold-text:#D9B45E; --soft:#1A2B40; --bar:#3D5F85;
  --accent:#6BB6EC; --accent-text:#6BB6EC; --accent-on:#0D1724;
  --btn-bg:#4FA3E0; --btn-ink:#0D1724; --btn-hi:#6BB6EC;
  --hdr-bg:#0D1724; --hdr-ink:#E8F0F7; --hdr-line:#26394F; --hdr-soft:#1A2B40; --hdr-field:#142235; --hdr-field-line:#34506E;
  --wood:#5BB37A; --fire:#E8604F; --earth:#D9A53A; --metal:#A9AFBD; --water:#5A8DDB;
  --good:#3E9B68; --bad:#D0564A; --mid:#A8902E; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}

/* header */
.top{background:var(--hdr-bg);color:var(--hdr-ink);border-bottom:1px solid var(--hdr-line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;background:none;border:0;color:inherit;padding:0;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.navlinks{display:flex;gap:22px;font-weight:500}
.navlinks button{background:none;border:0;color:inherit;opacity:.85;padding:4px 0}
.navlinks button:hover{opacity:1}
.crumb{border-top:1px solid var(--line);padding-block:12px;font-size:13px;opacity:.85;display:flex;gap:8px;flex-wrap:wrap}
.hero{padding-block:36px 44px;text-align:center}
.hero h1{font-family:var(--display);font-size:clamp(28px,5vw,40px);margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;opacity:.85}
.ilgin{display:inline-flex;gap:10px;align-items:center;margin-top:16px;background:var(--hdr-soft);border:1px solid var(--hdr-field-line);border-radius:999px;padding:6px 16px;font-size:14px}
.ilgin b{color:var(--gold);font-family:var(--display);font-size:17px;letter-spacing:.08em}

main{padding-block:40px 64px}
section+section{margin-top:56px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-family:var(--display);font-size:26px;margin:0}
.sec-h p{margin:0;color:var(--muted)}
.tag{font-size:11px;letter-spacing:.12em;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}

/* dream search band */
.dream-band{background:var(--surface);border:1px solid var(--line);padding:24px;display:grid;gap:14px}
.dream-band h2{font-family:var(--display);margin:0;font-size:22px}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0;font:inherit;padding:14px 16px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{background:var(--btn-bg);color:var(--btn-ink);border:0;padding:12px 20px;font-weight:600}
.btn:hover{background:var(--btn-hi)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-hi)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border:0;color:var(--ink);padding:6px 12px;border-radius:999px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-on);font-weight:600}

/* big cards */
.big{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.card{position:relative;display:flex;justify-content:space-between;gap:16px;text-align:left;border:0;padding:26px 26px 24px;min-height:170px;background:var(--primary);color:var(--on-primary);border:1px solid var(--card-line);transition:border-color .15s,transform .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card h3{margin:0 0 10px;font-size:19px;font-weight:600}
.card p{margin:0;opacity:.85;font-size:14px;max-width:24ch}
.card svg{flex:none;width:52px;height:52px;align-self:center;stroke:var(--gold);fill:none;stroke-width:1.6}
.card .badge{display:inline-block;margin-top:14px;background:var(--gold);color:#0A0A0A;font-size:11px;font-weight:700;letter-spacing:.14em;padding:3px 12px;border-radius:999px}
.span3{grid-column:span 3}.span2{grid-column:span 2}
.card.alt{background:var(--primary-hi)}

/* small cards */
.small{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.scard{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:24px 22px;min-height:96px;transition:border-color .15s}
.scard:hover{border-color:var(--accent)}
.scard b{display:block;font-weight:600}
.scard span{font-size:13px;color:var(--muted)}
.scard svg{flex:none;width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.6}
.soon{font-size:11px;color:var(--gold-text);font-weight:600;margin-left:6px}

@media (max-width:820px){
  .big{grid-template-columns:repeat(2,1fr)} .span3,.span2{grid-column:span 1}
  .big .card:first-child,.big .card:nth-child(2){grid-column:span 2}
  .small{grid-template-columns:repeat(2,1fr)} .navlinks{display:none}
}
@media (max-width:480px){.big .card{grid-column:span 2!important}.card{min-height:140px}}

/* sub pages */
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:20px}
.panel{background:var(--surface);border:1px solid var(--line);padding:24px}
.pagetitle{font-family:var(--display);font-size:30px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 24px}
.note{font-size:12px;color:var(--muted);margin-top:16px}

/* dream results */
.dlist{display:grid;gap:10px;margin-top:18px}
.ditem{background:var(--surface);border:1px solid var(--line);padding:18px 20px;display:grid;gap:6px}
.ditem h4{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ditem p{margin:0;color:var(--muted)}
.luck{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
.luck.good{background:var(--good)}.luck.bad{background:var(--bad)}.luck.mid{background:var(--mid)}
.ai{border-style:dashed}

/* tarot */
.fan{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:20px 0}
.back-card{width:44px;height:72px;border:1px solid var(--line-hi);background:var(--primary-hi);border-radius:4px;position:relative;transition:transform .15s}
.back-card::after{content:"";position:absolute;inset:5px;border:1px solid rgb(207 168 74 / .5);border-radius:2px;background:radial-gradient(circle,rgb(207 168 74 / .45) 0 2px,transparent 3px) center/12px 12px}
.back-card:hover{transform:translateY(-6px)}
.back-card[disabled]{opacity:.2;cursor:default;transform:none}
.spread{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.slot{perspective:900px}
.slot .lbl{font-size:12px;letter-spacing:.14em;color:var(--muted);text-align:center;margin-bottom:8px}
.flip{position:relative;aspect-ratio:3/5;max-width:100%;transform-style:preserve-3d;transition:transform .7s}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;border:1px solid var(--line)}
.face.f{background:var(--primary-hi)}
.face.f::after{content:"";position:absolute;inset:10px;border:1px solid rgb(207 168 74 / .5)}
.face.b{background:var(--surface);transform:rotateY(180deg);gap:6px}
.face.b .num{font-family:var(--display);color:var(--gold);font-size:20px}
.face.b .nm{font-family:var(--display);font-size:clamp(14px,2.6vw,20px);font-weight:700}
.face.b .kw{font-size:12px;color:var(--muted)}
.reading{margin-top:20px;display:grid;gap:10px}
.reading p{margin:0}

/* lotto */
.machine{display:grid;place-items:center;gap:16px;padding-block:8px}
.globe{width:180px;height:180px;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle at 35% 30%,var(--surface),var(--soft));position:relative;overflow:hidden}
.globe i{position:absolute;width:22px;height:22px;border-radius:50%}
.globe.spin i{animation:bounce .5s infinite alternate ease-in-out}
@keyframes bounce{to{transform:translate(var(--dx),var(--dy))}}
.sets{display:grid;gap:10px;width:100%}
.setrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);padding:12px 14px}
.setrow .k{font-size:12px;color:var(--muted);width:22px;font-variant-numeric:tabular-nums}
.ball{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;box-shadow:inset -3px -4px 0 rgb(0 0 0 / .15);animation:pop .35s both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.b1{background:#E9B824;color:#3a2a00}.b2{background:#3E7BD8}.b3{background:#E0564A}.b4{background:#7D8494}.b5{background:#3BA55C}
.plus{color:var(--muted);font-weight:700}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.ctrl select{font:inherit;padding:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* saju */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.form select,.form input{font:inherit;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}.spread{gap:8px}}
.pillars{width:100%;border-collapse:collapse;text-align:center;font-variant-numeric:tabular-nums}
.pillars th{font-size:12px;color:var(--muted);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}
.pillars td{padding:10px 4px;border-bottom:1px solid var(--line)}
.han{font-family:var(--display);font-size:28px;font-weight:700;display:block;line-height:1.2}
.han+small{font-size:12px;color:var(--muted)}
.w{color:var(--wood)}.f{color:var(--fire)}.e{color:var(--earth)}.m{color:var(--metal)}.wa{color:var(--water)}
.bars{display:grid;gap:8px;margin-top:6px}
.bar{display:grid;grid-template-columns:44px 1fr 34px;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.bar .t{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .t span{display:block;height:100%;border-radius:99px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.score{display:flex;align-items:center;gap:20px}
.ring{--p:70;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring b{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:28px}
.items{display:grid;gap:14px}
.items h4{margin:0 0 4px;font-size:15px}
.items p{margin:0;color:var(--muted)}
.lucky{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.lucky div{background:var(--soft);padding:12px 6px}
.lucky small{display:block;color:var(--muted);font-size:12px}
@media (max-width:520px){.lucky{grid-template-columns:repeat(2,1fr)}}
.example{display:inline-block;font-size:12px;color:var(--gold-text);border:1px solid var(--gold-text);padding:2px 10px;border-radius:999px;margin-bottom:12px}

/* tarot image face */
.face.b{padding:0;overflow:hidden;justify-content:flex-end}
.face.b img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face.b .cap{position:relative;width:100%;display:grid;gap:2px;padding:28px 6px 10px;background:linear-gradient(transparent,rgb(0 0 0 / .88) 45%)}
.face.b .cap .num{color:#E9C46A;font-size:14px}
.face.b .cap .nm{color:#fff;font-size:clamp(13px,2.4vw,18px)}
.face.b .cap .kw{color:rgb(255 255 255 / .8);font-size:11px}

/* result pages */
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;gap:6px;height:180px;padding-top:22px}
.col{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;min-width:0}
.col .v{color:var(--muted)}
.col .bw{display:flex;align-items:flex-end;justify-content:center}
.col .bw span{display:block;width:70%;max-width:34px;background:var(--bar);border-radius:4px 4px 0 0}
.col.hi .bw span{background:var(--gold)}
.col.lo .bw span{background:var(--bad)}
.col .k{color:var(--muted);padding-top:6px;white-space:nowrap}
.col.hi .k{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dolist{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dolist ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.dolist li+li{margin-top:4px}
.dolist h4{margin:0;font-size:15px}
.good-t{color:var(--good)}.bad-t{color:var(--bad)}
@media (max-width:560px){.dolist{grid-template-columns:1fr}}
.days{display:grid;gap:0}
.day{display:grid;grid-template-columns:64px 44px 1fr;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.day:last-child{border-bottom:0}
.day b{font-weight:600}
.day .s{color:var(--gold-text);font-weight:700}
.day p{margin:0;color:var(--muted);min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.cal .wd{font-size:11px;color:var(--muted);padding-bottom:4px}
.cal .d{padding:8px 0;border-radius:6px}
.cal .d.g{background:var(--good);color:#fff;font-weight:700}
.cal .d.c{background:var(--bad);color:#fff;font-weight:700}
.cal .d.t{outline:2px solid var(--gold)}
.kw3{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kw3 span{background:var(--soft);padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.daeun{width:100%;border-collapse:collapse;text-align:center;font-variant-numeric:tabular-nums;min-width:560px}
.daeun th{font-size:12px;color:var(--muted);font-weight:500;padding:6px;border-bottom:1px solid var(--line)}
.daeun td{padding:8px 4px;font-family:var(--display);font-size:20px;line-height:1.25}
.daeun td.now{background:var(--soft);outline:2px solid var(--gold)}
.daeun th.now{color:var(--gold-text);font-weight:700}
.jobs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.jobs span{border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-size:13px}
.share{background:var(--primary);color:var(--on-primary);border:1px solid var(--card-line);padding:32px 24px;text-align:center;display:grid;gap:10px;justify-items:center;position:relative}
.share::after{content:"";position:absolute;inset:10px;border:1px solid rgb(207 168 74 / .35);pointer-events:none}
.share small{opacity:.8;letter-spacing:.12em;font-size:12px}
.share h2{font-family:var(--display);font-size:clamp(24px,5vw,34px);margin:0;text-wrap:balance}
.share p{margin:0;opacity:.88;max-width:40ch}
.share .kw3 span{background:rgb(255 255 255 / .1);color:var(--on-primary);border:1px solid rgb(255 255 255 / .2)}
.share svg{width:56px;height:56px;stroke:var(--gold);fill:none;stroke-width:1.6}
.couple{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.couple .who{background:var(--soft);padding:14px 8px}
.couple .who b{display:block;font-family:var(--display);font-size:22px}
.couple .who small{color:var(--muted);font-size:12px}
.couple .x{font-family:var(--display);font-size:24px;color:var(--gold-text)}
.bar.wide{grid-template-columns:96px 1fr 40px}
.mt{margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;font-size:14px;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 신비: 꿈 일기장 · 별자리 · 띠 */
.btn.sm{padding:6px 12px;font-size:13px}
.zgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
@media (max-width:720px){.zgrid{grid-template-columns:repeat(3,1fr)}}
.zbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:14px 6px;display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.zbtn:hover{border-color:var(--accent)}
.zbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.zbtn .sym{font-size:26px;line-height:1.25;color:var(--accent-text);font-family:var(--display)}
.zbtn b{font-size:14px;font-weight:600}
.zbtn small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.finder{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.finder label{font-size:13px;color:var(--muted)}
.finder input{font:inherit;padding:9px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.form textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:110px;resize:vertical}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.moods .chip{font-size:18px;padding:6px 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:var(--soft);padding:14px 6px;min-width:0}
.stats b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
.entry .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry .acts{display:flex;gap:8px;flex-wrap:wrap}
.entry .match{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}

.years{display:grid;gap:10px}
.years div{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:baseline}
.years b{font-variant-numeric:tabular-nums}
.years span{color:var(--muted)}

/* 타로 종합 해설 */
.tq{display:grid;gap:10px;margin-bottom:18px}
.tq input{font:inherit;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}

.face.b img.rev{transform:rotate(180deg)}
.face.b .cap .rv{color:var(--bad);font-size:11px;font-weight:700;letter-spacing:.08em}
.rd-q{border-left:2px solid var(--gold);padding:4px 0 4px 14px;display:grid;gap:4px}
.rd-q small{color:var(--muted)}
.rd-q b{font-size:16px}
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:720px){.rcards{grid-template-columns:1fr}}
.rcards .panel{display:grid;gap:8px;align-content:start;min-width:0}
.rcards h4{margin:0;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rcards .pos{font-size:11px;letter-spacing:.14em;color:var(--gold-text)}
.rcards p{margin:0;color:var(--muted);font-size:14px}
.dir{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.dir.up{color:var(--good)}.dir.rv{color:var(--bad)}
.summary{border:1px solid var(--gold);background:var(--surface);padding:24px;display:grid;gap:12px}
.summary h3{font-family:var(--display);margin:0;font-size:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.summary p{margin:0;line-height:1.75}
.flow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-family:var(--body);color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.flow b{color:var(--ink)}
.flow svg{width:54px;height:20px;overflow:visible}
.topics{display:grid;gap:10px}
.topics div{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:baseline}
.topics b{color:var(--gold-text);font-size:14px}
.topics span{color:var(--muted);min-width:0}
.advice{font-size:17px;font-weight:700;margin:0}

/* 일반/다크 토글 */
.themebtn{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--hdr-ink);border:1px solid var(--hdr-field-line);border-radius:999px;padding:5px 12px;font-size:13px;flex:none}
.themebtn:hover{border-color:var(--accent)}
.themebtn i{font-style:normal;color:var(--gold)}

/* 헤더 생년월일 바 */
.nav{flex-wrap:wrap;row-gap:10px}
.pbar{display:flex;align-items:center;gap:8px;flex:1;min-width:0;justify-content:flex-end}
.pbar .seg{display:flex;border:1px solid var(--hdr-field-line);border-radius:999px;overflow:hidden;flex:none}
.pbar .seg button{background:transparent;border:0;color:inherit;padding:6px 11px;font-size:13px;opacity:.75}
.pbar .seg button[aria-pressed="true"]{background:var(--hdr-ink);color:var(--hdr-bg);opacity:1;font-weight:700}
.pbar input,.pbar select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--hdr-field-line);border-radius:8px;background:var(--hdr-field);color:inherit;min-width:0;color-scheme:dark}
.pbar select option{color:var(--hdr-ink);background:var(--hdr-field)}
.pbar input{width:9.6em}
.pbar select{width:8.6em}
.pres{font-family:var(--display);font-size:14px;white-space:nowrap;color:var(--gold);background:var(--hdr-soft);padding:5px 12px;border-radius:999px}
@media (max-width:720px){
  .pbar{flex-basis:100%;justify-content:flex-start;gap:6px}
  .pbar input{flex:1 1 0;width:auto}.pbar select{flex:1 1 0;width:auto}
  .pres{display:none}
  .themebtn{order:2;margin-left:auto}.pbar{order:3}
  .themebtn span{display:none}
}

/* ---------- 일진 계산 (2026-10-12 = 己未 기준) ---------- */
const GAN='甲乙丙丁戊己庚辛壬癸',JI='子丑寅卯辰巳午未申酉戌亥';
const GANJI=[...Array(60)].map((_,i)=>GAN[i%10]+JI[i%12]);
(function(){
  const now=new Date(),base=Date.UTC(2026,9,12),t=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  const d=Math.round((t-base)/864e5),idx=((55+d)%60+60)%60; // 己未 = 55
  $('#ilgin').textContent=GANJI[idx];
  $('#today').textContent=`${now.getMonth()+1}월 ${now.getDate()}일`;
})();

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2400)}

function go(v,arg){
  if(!VIEWS[v])v='home';CUR=v;CARG=arg;

  (VIEWS[v]||VIEWS.home)(arg);
  try{history.replaceState(null,'',v==='home'?location.pathname:'#'+v)}catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go,b.dataset.arg)}});

  <form class="searchrow" id="df"><input id="dq2" value="${q||''}" placeholder="예) 돼지, 이빨, 하늘" aria-label="꿈 검색"><button class="btn">검색</button></form>
  <div class="chips" style="margin-top:12px" id="cats">${cats.map((c,i)=>`<button type="button" class="chip" aria-pressed="${i==0}" data-c="${c}">${c}</button>`).join('')}</div>
  <div class="dlist" id="dl"></div>`;
  let cat='전체';
  const render=()=>{
    const k=$('#dq2').value.trim().replace(/\s*꿈$/,'');
    const r=DREAMS.filter(d=>(cat==='전체'||d[0]===cat)&&(!k||(d[1].includes(k)||d[3].includes(k))));
    $('#dl').innerHTML=r.map(d=>`<article class="ditem"><h4>${d[1]}<span class="luck ${LUCK[d[2]][1]}">${LUCK[d[2]][0]}</span><span class="tag" style="color:var(--muted)">${d[0]}</span></h4><p>${d[3]}</p><div><button class="btn ghost sm" type="button" data-go="diary" data-arg="${d[1]}">일기에 저장</button></div></article>`).join('')
      +(k?`<article class="ditem ai"><h4>찾는 꿈이 없나요?</h4><p>꿈 내용을 문장으로 적으면 AI가 해몽해 드려요. (예: "어젯밤 바다에서 금붕어를 잡았어요")</p><div><button class="btn ghost" type="button" id="aib">AI에게 해몽 받기</button></div></article>`:'');
    const a=$('#aib'); if(a)a.onclick=()=>toast('실제 서비스에서는 Claude가 꿈 내용을 해석해요 (M3 단계)');
  };
  $('#df').onsubmit=e=>{e.preventDefault();render()};
  $('#cats').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;$('#cats').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));render()};
  render();
};

{k:'XVII',n:'별',ku:'희망 · 치유',kr:'낙담 · 자신감 저하',ty:'light',tn:2,up:'지친 마음이 회복되는 시기예요. 멀리 있던 목표가 다시 선명해져요.',rv:'희망이 잠시 흐려졌어요. 작은 목표부터 다시 세우면 빛이 돌아와요.',love:'편안하고 순수한 감정이 오가요. 상처가 있었다면 회복돼요.',work:'장기적인 꿈을 향해 한 걸음 나아가기 좋아요. 영감이 찾아와요.',money:'당장보다 미래를 위한 저축과 계획에 좋아요.',adv:'이루고 싶은 것 하나를 오늘 적어보세요.',tip:'남과 비교하지 말고 내 속도를 믿으세요.'},
{k:'XVIII',n:'달',ku:'불안 · 모호함',kr:'오해 해소 · 진실',ty:'inner',tn:-1,up:'확실하지 않은 것들 때문에 마음이 흔들려요. 불안이 실제보다 크게 느껴져요.',rv:'안개가 걷히며 숨겨졌던 진실이 드러나요. 오해가 풀려요.',love:'상대의 마음이 잘 안 보여 불안해요. 추측보다 직접 물어보세요.',work:'정보가 부족한 상태예요. 중요한 결정은 확인 후로 미루세요.',money:'애매한 투자나 거래는 피하세요. 계약서는 끝까지 읽으세요.',adv:'불안할수록 확인된 사실만 붙잡으세요.',tip:'드러난 진실을 피하지 말고 마주하세요.'},
{k:'XIX',n:'태양',ku:'성공 · 기쁨',kr:'과신 · 지연된 기쁨',ty:'light',tn:2,up:'모든 것이 밝게 드러나는 날이에요. 자신 있게 나서면 좋은 결과가 따라와요.',rv:'좋은 일은 오지만 조금 늦게 와요. 자신감이 지나치지 않게 조절하세요.',love:'함께 있으면 즐거운 관계예요. 공개 연애나 고백에 좋아요.',work:'성과가 인정받아요. 발표, 면접, 시험에 강한 기운이에요.',money:'수입이 늘고 기분 좋은 소비가 생겨요.',adv:'오늘은 숨지 말고 당당하게 드러내 보세요.',tip:'축배는 결과가 확정된 뒤에 드세요.'},
{k:'XX',n:'심판',ku:'부활 · 소식',kr:'후회 · 결정 회피',ty:'change',tn:1,up:'기다리던 연락이나 결과가 와요. 지난 노력이 다시 평가받아요.',rv:'과거의 선택을 계속 곱씹고 있어요. 이제는 스스로를 용서할 때예요.',love:'예전 인연에게서 연락이 오거나 관계가 새로 시작돼요.',work:'재도전에 좋은 때예요. 합격이나 승진 소식이 들려요.',money:'묵혀둔 돈이나 받을 돈이 돌아와요.',adv:'미뤄둔 답장이나 연락을 오늘 해보세요.',tip:'지난 일은 교훈만 남기고 내려놓으세요.'},
{k:'XXI',n:'세계',ku:'완성 · 성취',kr:'미완성 · 마무리 부족',ty:'stable',tn:2,up:'하나의 여정이 잘 마무리돼요. 노력한 만큼 보상받고 다음 단계로 넘어가요.',rv:'거의 다 왔는데 마지막 한 조각이 빠져 있어요. 마무리에 집중하세요.',love:'관계가 안정되고 한 단계 깊어져요. 함께 미래를 이야기하기 좋아요.',work:'프로젝트 완료, 졸업, 목표 달성의 기운이에요. 해외나 먼 곳과 인연이 있어요.',money:'목표했던 금액에 가까워져요. 성취를 즐겨도 좋아요.',adv:'끝낸 일을 스스로 칭찬해 주세요.',tip:'마지막 10%를 대충 넘기지 마세요.'}

VIEWS.tarot=()=>{
  const deck=[...TAROT.keys()].sort(()=>Math.random()-.5);let pick=[];let topic='all';
  const TOPICS=[['all','오늘 전반'],['love','연애'],['work','일·학업'],['money','금전']];
  app.innerHTML=`<button class="back" data-go="home">‹ 홈으로</button>
  <h1 class="pagetitle">오늘의 타로</h1><p class="lead">주제를 고르고 질문을 떠올린 뒤, 끌리는 카드 3장을 골라보세요.</p>
  <div class="tq">
    <span class="lbl2">질문 주제</span>
    <div class="chips" id="tpc">${TOPICS.map(([v,l])=>`<button type="button" class="chip" data-t="${v}" aria-pressed="${v==='all'}">${l}</button>`).join('')}</div>
    <input id="tqi" maxlength="60" placeholder="질문이 있다면 적어보세요 (선택) 예) 이번 주에 고백해도 될까?" aria-label="타로 질문">
  </div>
  <div class="spread">${['과거','현재','미래'].map((l,i)=>`<div class="slot"><div class="lbl">${l}</div><div class="flip" id="s${i}"><div class="face f"></div><div class="face b"></div></div></div>`).join('')}</div>
  <div class="fan" id="fan">${deck.map(i=>`<button class="back-card" data-i="${i}" aria-label="카드 고르기"></button>`).join('')}</div>
  <div class="reading" id="rd"></div>
  <div class="ctrl" style="margin-top:16px"><button class="btn ghost" id="re">다시 섞기</button></div>
  <p class="note">메이저 아르카나 22장 · 정방향/역방향 반영. 실제 서비스에서는 질문에 맞춘 해석을 AI가 만들어요. 카드 이미지: Rider-Waite 타로(1909, 퍼블릭 도메인)</p>`;
  $('#re').onclick=()=>VIEWS.tarot();
  $('#tpc').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;topic=b.dataset.t;$('#tpc').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));if(pick.length===3)tarotReading(pick,topic,$('#tqi').value.trim())};
  $('#fan').onclick=e=>{
    const b=e.target.closest('.back-card');if(!b||b.disabled||pick.length>=3)return;
    b.disabled=true;const i=+b.dataset.i,c=TAROT[i],n=pick.length,rev=Math.random()<.3;pick.push({c,rev});
    const s=$('#s'+n);s.querySelector('.b').innerHTML=`<img src="${TAROT_IMG[i]}" alt="${c.n} 카드${rev?' (역방향)':''}"${rev?' class="rev"':''}><span class="cap"><span class="num">${c.k}</span><span class="nm">${c.n}</span>${rev?'<span class="rv">역방향</span>':''}<span class="kw">${rev?c.kr:c.ku}</span></span>`;
    setTimeout(()=>s.classList.add('on'),30);
    if(pick.length===3){
      $('#fan').querySelectorAll('.back-card').forEach(x=>x.disabled=true);
      setTimeout(()=>tarotReading(pick,topic,$('#tqi').value.trim()),750);
    }
  };
};
/* 받침 유무로 조사 고르기 */
function josa(w,pair){const ch=w.charCodeAt(w.length-1);const jong=ch>=0xAC00&&ch<=0xD7A3?(ch-0xAC00)%28:0;const [a,b]=pair.split('/');const has=pair==='으로/로'?(jong!==0&&jong!==8):jong!==0;return w+(has?a:b)}
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const TTHEME={start:'새로운 시작',inner:'내면을 들여다보는 시간',bond:'관계와 조화',stable:'안정과 마무리',drive:'밀어붙이는 힘',change:'큰 변화',shadow:'끊어내야 할 것',light:'밝은 희망'};
const TTHEME_S={start:'세 장 중 여러 장이 시작을 말하고 있어요. 새로 무언가를 벌이기에 딱 좋은 시기예요.',

 bond:'사람과 관계에 관한 카드가 겹쳤어요. 지금 답은 혼자가 아니라 누군가와 함께하는 데 있어요.',
 stable:'질서와 마무리를 뜻하는 카드가 겹쳤어요. 벌여놓은 일을 잘 매듭지으면 다음 단계가 열려요.',
 drive:'추진력을 뜻하는 카드가 겹쳤어요. 망설이기보다 실행할수록 결과가 따라와요.',
 change:'변화의 카드가 두 장 이상 나왔어요. 지금은 확실한 전환기라, 익숙한 방식에서 벗어날 준비가 필요해요.',
 shadow:'유혹과 집착의 기운이 강해요. 나를 붙잡고 있는 것부터 정리해야 흐름이 풀려요.',
 light:'희망과 기쁨의 카드가 겹쳤어요. 전체적으로 운이 당신 편에 서 있어요.'};
function tarotReading(pick,topic,q){
  const P=['과거','현재','미래'];
  const tone=p=>p.rev?(p.c.tn>=0?-1:p.c.tn+1):p.c.tn;
  const kw=p=>(p.rev?p.c.kr:p.c.ku).split(' · ')[0];
  const T=pick.map(tone);
  const meanPos=(p,i)=>{
    const m=p.rev?p.c.rv:p.c.up,k=kw(p);
    if(i===0)return `지금까지는 ${josa(k,'이/가')} 당신을 이끌어 왔어요. ${m}`;
    if(i===1)return `지금 당신은 ${k}의 한가운데에 있어요. ${m}`;
    return `앞으로는 ${k} 쪽으로 흘러갈 거예요. ${m}`;
  };
  const cards=pick.map((p,i)=>`<div class="panel"><span class="pos">${P[i]}</span><h4>${p.c.n}<span class="dir ${p.rev?'rv':'up'}">${p.rev?'역방향':'정방향'}</span></h4><p>${meanPos(p,i)}</p></div>`).join('');
  // 흐름
  const d=T[2]-T[0];let flow,flowS;
  const [n0,n1,n2]=pick.map(p=>p.c.n);
  if(T[1]<T[0]&&T[1]<T[2]){flow='반등';flowS=`${josa(n0,'에서/에서')} 시작해 지금의 ${josa(n1,'이/가')} 가장 낮은 지점이에요. 여기서부터는 ${josa(n2,'을/를')} 향해 다시 올라가는 흐름이에요.`}
  else if(T[1]>T[0]&&T[1]>T[2]){flow='정점';flowS=`지금의 ${josa(n1,'이/가')} 세 장 중 가장 밝아요. 지금이 기세가 가장 좋을 때라, 이 흐름을 잘 지키는 게 중요해요.`}
  else if(d>=2){flow='상승';flowS=`과거의 ${josa(n0,'에서/에서')} 미래의 ${josa(n2,'으로/로')} 갈수록 기운이 점점 밝아지는 흐름이에요. 시간이 당신 편이에요.`}
  else if(d<=-2){flow='하락';flowS=`과거의 ${josa(n0,'보다/보다')} 미래의 ${josa(n2,'이/가')} 더 조심스러워요. 지금 잘 풀리는 일도 속도를 조금 늦추는 게 좋아요.`}
  else {flow='유지';flowS=`${n0}, ${n1}, ${josa(n2,'으로/로')} 이어지는 동안 큰 기복은 없어요. 지금의 흐름이 한동안 이어진다고 보면 돼요.`}
  if(flowS.includes('에서에서'))flowS=flowS.replace('에서에서','에서');
  // 테마
  const cnt={};pick.forEach(p=>cnt[p.c.ty]=(cnt[p.c.ty]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  let themeS=top[1]>=2?TTHEME_S[top[0]]:`카드가 각각 ${josa(pick.map(p=>TTHEME[p.c.ty]).join(', '),'을/를')} 말하고 있어요. 여러 방향을 동시에 고민하는 시기예요.`;
  const revN=pick.filter(p=>p.rev).length;
  const revS=revN>=2?' 역방향이 많이 나온 건 아직 마음이나 상황이 정리되지 않았다는 뜻이에요. 서두르지 않는 게 좋아요.':revN===0?' 세 장 모두 정방향이라 흐름이 막힘 없이 흘러가요.':'';
  // 주제 초점
  const TL={all:'오늘 하루',love:'연애',work:'일과 학업',money:'금전'};
  const field=p=>topic==='all'?`${josa(kw(p),'을/를')} 어떻게 다루느냐가 오늘 하루를 좌우해요. ${p.rev?p.c.tip:p.c.adv}`:(p.rev?`${josa(p.c.n,'이/가')} 역방향으로 나와서 ${TL[topic]} 쪽은 한 템포 쉬어가는 게 좋아요. ${p.c.tip}`:p.c[topic]);
  const focusS=`${TL[topic]}만 놓고 보면 현재의 ${josa(n1,'이/가')} 핵심이에요. ${field(pick[1])}`;
  const futS=`마지막 카드인 ${josa(n2,'은/는')} 이렇게 말해요. "${pick[2].rev?pick[2].c.tip:pick[2].c.adv}"`;
  // 주제별 한 줄 (미래 카드 우선, 역방향이면 현재 카드)
  const src=(pick[2].rev&&!pick[1].rev)?pick[1]:pick[2];
  const RL={love:k=>`${k}의 기운이 걸려 있어요. 감정 표현은 조금 아껴두고 상대의 속도에 맞춰보세요.`,work:k=>`${josa(k,'으로/로')} 진행이 더뎌질 수 있어요. 일정에 여유를 두고 하나씩 처리하세요.`,money:k=>`${k}의 기운이 있어 큰 지출이나 투자는 잠시 미뤄두는 게 좋아요.`};
  const line=f=>src.rev?RL[f](kw(src)):src.c[f];
  const adv=pick[1].rev?pick[1].c.tip:pick[1].c.adv;
  const keys=pick.map(kw);
  // 스파크라인
  const y=v=>16-(v+2)*3;
  const spark=`<svg viewBox="0 0 54 20" aria-hidden="true"><polyline points="${T.map((v,i)=>`${4+i*23},${y(v)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>${T.map((v,i)=>`<circle cx="${4+i*23}" cy="${y(v)}" r="2.6" fill="var(--accent)"/>`).join('')}</svg>`;
  // 질문 답
  const ft=T[2];
  const ans=ft>=2?'해도 좋아요. 흐름이 확실히 당신 편이에요.':ft===1?'좋은 쪽으로 기울어 있어요. 준비가 됐다면 움직여 보세요.':ft===0?'조금 더 지켜본 뒤에 움직이는 게 좋아요.':ft===-1?'지금은 기다리는 편이 좋아요.':'이번엔 한발 물러서는 게 현명해요.';
  $('#rd').innerHTML=`
   ${q?`<div class="rd-q"><small>질문</small><b>${esc(q)}</b><span>답: ${ans} <small>(미래 · ${n2}${pick[2].rev?' 역방향':''})</small></span></div>`:''}
   <div class="rcards">${cards}</div>
   <div class="summary">
     <h3>종합 해설 <span class="flow">흐름 <b>${flow}</b>${spark}</span></h3>
     <p>${flowS} ${themeS}${revS}</p>
     <p>${focusS} ${futS}</p>
   </div>
   <div class="panel topics">
     <div><b>연애</b><span>${line('love')}</span></div>
     <div><b>일·학업</b><span>${line('work')}</span></div>
     <div><b>금전</b><span>${line('money')}</span></div>
   </div>
   <div class="panel" style="display:grid;gap:10px">
     <small style="color:var(--muted)">오늘의 조언</small>
     <p class="advice">${adv}</p>
     <div class="kw3">${keys.map(k=>`<span>#${k}</span>`).join('')}</div>
   </div>`;
}

const cls=n=>n<=10?'b1':n<=20?'b2':n<=30?'b3':n<=40?'b4':'b5';
VIEWS.lotto=()=>{
  app.innerHTML=`<button class="back" data-go="home">‹ 홈으로</button>
  <h1 class="pagetitle">로또 번호 뽑기</h1><p class="lead">운세가 아니라 순수한 랜덤 추첨이에요. 재미로만 즐겨주세요.</p>
  <div class="machine">
    <div class="globe" id="globe">${[...Array(14)].map((_,i)=>{const n=i*3+2;return `<i class="${cls(n)}" style="left:${15+Math.random()*130}px;top:${15+Math.random()*130}px;--dx:${(Math.random()-.5)*60}px;--dy:${(Math.random()-.5)*60}px;animation-delay:${-Math.random()}s"></i>`}).join('')}</div>
    <div class="ctrl"><select id="cnt" aria-label="세트 수">${[1,2,3,4,5].map(n=>`<option ${n==3?'selected':''}>${n}</option>`).join('')}</select><span>세트</span><button class="btn" id="draw">추첨 시작</button></div>
    <div class="sets" id="sets"></div>
  </div>`;
  const draw=()=>{
    const g=$('#globe');g.classList.add('spin');$('#draw').disabled=true;
    const sets=[...Array(+$('#cnt').value)].map(()=>{const p=[...Array(45)].map((_,i)=>i+1).sort(()=>Math.random()-.5);return{m:p.slice(0,6).sort((a,b)=>a-b),b:p[6]}});
    $('#sets').innerHTML=sets.map((s,i)=>`<div class="setrow"><span class="k">${String.fromCharCode(65+i)}</span>${s.m.map((n,j)=>`<span class="ball ${cls(n)}" style="animation-delay:${(i*7+j)*.18}s">${n}</span>`).join('')}<span class="plus">+</span><span class="ball ${cls(s.b)}" style="animation-delay:${(i*7+6)*.18}s">${s.b}</span></div>`).join('');
    setTimeout(()=>{g.classList.remove('spin');$('#draw').disabled=false},sets.length*7*180+300);
  };
  $('#draw').onclick=draw;draw();
};

const EL=['木','火','土','金','水'],EL_KO={木:'목',火:'화',土:'토',金:'금',水:'수'};
const EL_TOK={木:'--wood',火:'--fire',土:'--earth',金:'--metal',水:'--water'},EL_CLS={木:'w',火:'f',土:'e',金:'m',水:'wa'};
const GAN_EL=['木','木','火','火','土','土','金','金','水','水'];
const JI_EL=['水','土','木','木','土','火','火','土','金','金','土','水'];

const SEASON=['겨울','겨울','봄','봄','봄','여름','여름','여름','가을','가을','가을','겨울'];
const mod=(a,n)=>((a%n)+n)%n;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return{y,m,d}};
const dayNum=(y,m,d)=>Math.round(Date.UTC(y,m-1,d)/864e5);
const REF_DAY=dayNum(2026,10,12); // 己未 = 55
const gj=i=>({i,g:i%10,j:i%12,s:GANJI[i]});
const idxOf=(g,j)=>{for(let i=0;i<60;i++)if(i%10===g&&i%12===j)return i;return 0};
// 절기 시작일 근사 (월/일 → 월지)
const TERMS=[[106,1],[204,2],[306,3],[405,4],[506,5],[606,6],[707,7],[808,8],[908,9],[1008,10],[1107,11],[1207,0]];
const solarYear=(y,m,d)=>(m<2||(m===2&&d<4))?y-1:y;
const yearP=(y,m,d)=>gj(mod(solarYear(y,m,d)-1984,60));
const monthBranch=(m,d)=>{const md=m*100+d;let b=0;for(const[s,br]of TERMS)if(md>=s)b=br;return b};
const monthP=(y,m,d)=>{const yg=yearP(y,m,d).g,b=monthBranch(m,d),g=mod((yg%5)*2+2+mod(b-2,12),10);return gj(idxOf(g,b))}; // 五虎遁
const dayP=(y,m,d)=>gj(mod(55+dayNum(y,m,d)-REF_DAY,60));
const hourP=(dg,h)=>h<0?null:gj(idxOf(mod((dg%5)*2+h,10),h)); // 五鼠遁
const todayP=()=>{const n=new Date();return dayP(n.getFullYear(),n.getMonth()+1,n.getDate())};
const relOf=(me,o)=>mod(EL.indexOf(o)-EL.indexOf(me),5); // 0 비겁 1 식상 2 재성 3 관성 4 인성
const parentEl=e=>EL[mod(EL.indexOf(e)-1,5)];
function saju(p){
  const{y,m,d}=parseD(p.date);
  const Y=yearP(y,m,d),M=monthP(y,m,d),yaja=p.hour===12,dt=yaja?new Date(Date.UTC(y,m-1,d+1)):null;
  const D=yaja?dayP(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate()):dayP(y,m,d),H=hourP(D.g,yaja?0:p.hour); // 夜子: 다음 날 일주
  const pillars=[H,D,M,Y],cnt={木:0,火:0,土:0,金:0,水:0};
  pillars.forEach(x=>{if(x){cnt[GAN_EL[x.g]]++;cnt[JI_EL[x.j]]++}});
  const me=GAN_EL[D.g],total=pillars.filter(Boolean).length*2,support=cnt[me]+cnt[parentEl(me)];
  const sorted=EL.slice().sort((a,b)=>cnt[b]-cnt[a]),sign=signOf(m,d);
  return{p,y,m,d,Y,M,D,H,pillars,cnt,total,me,strong:support*2>=total,most:sorted[0],least:sorted[4],
    tti:TTI[Y.j][0],ttiIdx:Y.j,sign,season:SEASON[M.j],key:`${p.date}|${p.hour}|${p.gender}`,label:`${D.s}일주 · ${TTI[Y.j][0]}띠`};
}

const daeun=s=>{
  const fwd=(s.Y.g%2===0)===(s.p.gender==='M'),bd=Date.UTC(s.y,s.m-1,s.d);let best=null;
  for(let yy=s.y-1;yy<=s.y+1;yy++)for(const[md]of TERMS){const diff=(Date.UTC(yy,Math.floor(md/100)-1,md%100)-bd)/864e5;if(fwd?diff>0:diff<=0){const a=Math.abs(diff);if(best===null||a<best)best=a}}
  const start=Math.max(1,Math.round(best/3));
  return{start,fwd,list:[...Array(10)].map((_,k)=>({age:start+k*10,...gj(mod(s.M.i+(fwd?k+1:-(k+1)),60))}))};
};

function selfCheck(){
  const pass=[0,0,0,0],fails=[];
  SELF_CHECK.forEach(([date,hc,...ans])=>{const t=saju({gender:'M',date,hour:+hc/2}),got=[t.Y.s,t.M.s,t.D.s,t.H.s];
    got.forEach((g,i)=>{if(g===ans[i])pass[i]++;else fails.push(`${date} ${hc}시 ${['년','월','일','시'][i]}주 ${g}≠${ans[i]}`)})});
  const n=SELF_CHECK.length,ok=pass.every(x=>x===n);
  console.log(`[간이 만세력 self-check] ${ok?'PASS':'PARTIAL'} · 년주 ${pass[0]}/${n} · 월주 ${pass[1]}/${n} · 일주 ${pass[2]}/${n} · 시주 ${pass[3]}/${n}`,fails);
  return{pass,n,fails};
}

const seedOf=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.codePointAt(0),16777619);return()=>{h+=0x6D2B79F5;let x=h;x=Math.imul(x^x>>>15,x|1);x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296}};
const pickR=(r,a)=>a[Math.floor(r()*a.length)];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const dSave=a=>{DMEM=a;try{localStorage.setItem(DKEY,JSON.stringify(a));return true}catch(e){return false}};
const dAll=()=>dLoad()||DMEM||[];
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const DEX=()=>[
 {id:'ex1',date:daysAgo(1),text:'커다란 돼지가 우리 집 현관으로 걸어 들어왔어요. 이상하게 하나도 무섭지 않고 귀여웠어요.',mood:'😊',tag:'good',ex:true},

];
const dreamKey=d=>{const core=d[1].replace(/\s*꿈$/,'');return{core,key:core.split(' ')[0].replace(/(에게|에서|이|가|에|을|를)$/,'')}};
const matchDreams=text=>{
  const r=[];
  DREAMS.forEach(d=>{const{core,key}=dreamKey(d);let s=0;
    if(text.includes(core))s=2;
    else if(key.length>=2?text.includes(key):new RegExp(key+'(가|이|를|을|에|의|는|도|랑|와|\\s|꿈|$)').test(text))s=1;
    if(s)r.push([s,d])});
  return r.sort((a,b)=>b[0]-a[0]).slice(0,3).map(x=>x[1]);
};

const mdTxt=n=>`${Math.floor(n/100)}.${n%100}`;
const STAR_ALL=['작은 친절이 크게 돌아오는 날이에요. 먼저 인사를 건네 보세요.','계획대로 안 풀려도 괜찮아요. 오후부터 흐름이 내 쪽으로 바뀌어요.','집중력이 좋은 날이에요. 미뤄둔 일 하나를 끝내면 속이 시원해져요.','새로운 사람에게서 좋은 자극을 받아요. 들어온 약속은 피하지 마세요.','말이 앞서기 쉬운 날이에요. 한 번 더 생각하고 말하면 실수가 없어요.','마음이 가벼워지는 소식이 들려와요. 기대해도 좋아요.','평소처럼만 해도 충분한 날이에요. 큰 변화는 내일로 미뤄요.','운이 내 편인 날이에요. 망설이던 일에 한 발 내디뎌 보세요.'];
const STAR_LOVE=['대화가 잘 통하는 날이에요. 짧은 안부 메시지가 분위기를 바꿔요.','상대의 작은 변화를 알아봐 주면 점수가 확 올라가요.','솔로라면 친구 모임에서 반가운 얼굴을 만날 수 있어요.','서운한 마음은 쌓아두지 말고 부드럽게 꺼내 보세요.','혼자만의 시간이 오히려 관계를 단단하게 해줘요.','오래 연락 못 한 사람이 먼저 연락해 올 수 있어요.','고백은 오늘보다 주말이 더 좋아요. 분위기를 조금 더 살펴요.','함께 맛있는 걸 먹으면 마음이 금방 풀리는 날이에요.'];
const STAR_WORK=['회의에서 낸 아이디어가 좋은 반응을 얻어요.','꼼꼼함이 빛나는 날이에요. 숫자와 일정은 두 번 확인하세요.','혼자 끙끙대기보다 동료에게 물어보면 금방 풀려요.','마감에 쫓기기 쉬워요. 오전에 중요한 일부터 끝내세요.','새로운 툴이나 방법을 배워두면 곧 쓸 일이 생겨요.','윗사람의 칭찬이 들려오는 날이에요. 겸손하게 받아두세요.','공부 중이라면 외우기보다 정리하기가 잘 되는 날이에요.','일이 몰려도 우선순위만 정하면 충분히 해낼 수 있어요.'];
const STAR_MONEY=['충동구매만 조심하면 지갑이 든든한 하루예요.','작은 환급이나 용돈처럼 뜻밖의 돈이 들어올 수 있어요.','빌려준 돈 이야기는 오늘 꺼내지 않는 게 좋아요.','구독 서비스를 한 번 정리해 보세요. 새는 돈이 보여요.','커피 한 잔 값이라도 아끼면 기분 좋게 하루를 마쳐요.','투자는 지켜보는 날이에요. 큰 결정은 다음 주로 미뤄요.','선물 고르기에 좋은 날이에요. 마음이 잘 전해져요.','장보기 전에 목록을 쓰면 생각보다 많이 아낄 수 있어요.'];
VIEWS.star=(arg)=>{
  let cur=arg!=null&&arg!==''?+arg:SJ().sign;
  app.innerHTML=`${back()}
  <h1 class="pagetitle">별자리 운세</h1><p class="lead">내 별자리를 고르거나 생일을 넣어 찾아보세요. 운세는 매일 바뀌어요.</p>
  <div class="finder"><label for="zbd">생일로 찾기</label><input type="date" id="zbd" value="${P().date}"></div>
  <div class="zgrid" id="zg">${ZODIAC.map(([n,s,e,sym],i)=>`<button type="button" class="zbtn" data-z="${i}" aria-pressed="${i===cur}"><span class="sym">${sym}&#xFE0E;</span><b>${n}${i===SJ().sign?' · 나':''}</b><small>${mdTxt(s)}~${mdTxt(e)}</small></button>`).join('')}</div>
  <div id="zr"></div>`;
  const render=()=>{
    $('#zg').querySelectorAll('.zbtn').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.z===cur));
    const z=ZODIAC[cur],r=seedOf('star'+cur+TODAY()),sc=55+Math.floor(r()*41);
    const all=pickR(r,STAR_ALL),love=pickR(r,STAR_LOVE),work=pickR(r,STAR_WORK),money=pickR(r,STAR_MONEY);
    let mate=Math.floor(r()*12);if(mate===cur)mate=(mate+4)%12;
    $('#zr').innerHTML=ring(sc,`${z[3]}︎ ${z[0]} · 오늘의 총운`,all)+items([['애정',love],['일 · 학업',work],['금전',money]])+
      `<div class="lucky mt"><div><small>행운의 색</small><b>${pickR(r,LUCKY_COLOR)}</b></div><div><small>행운의 숫자</small><b>${1+Math.floor(r()*9)} · ${10+Math.floor(r()*36)}</b></div><div><small>잘 맞는 별자리</small><b>${ZODIAC[mate][0]}</b></div><div><small>행운의 아이템</small><b>${pickR(r,LUCKY_ITEM)}</b></div></div>
      <p class="note">${TODAY().replace(/-/g,'.')} 기준 · 같은 날에는 같은 결과가 나와요. 재미로만 봐주세요.</p>`;
  };
  $('#zg').onclick=e=>{const b=e.target.closest('[data-z]');if(!b)return;cur=+b.dataset.z;render()};
  $('#zbd').onchange=e=>{const v=e.target.value;if(!v)return;const[,m,d]=v.split('-').map(Number);cur=signOf(m,d);render();toast(`${ZODIAC[cur][0]}예요`)};
  render();
};

/* ---------- 띠별 운세 ---------- */
const TTI=[['쥐','子'],['소','丑'],['호랑이','寅'],['토끼','卯'],['용','辰'],['뱀','巳'],['말','午'],['양','未'],['원숭이','申'],['닭','酉'],['개','戌'],['돼지','亥']];
const ttiYears=i=>{const y=new Date().getFullYear(),a=[];for(let k=1950;k<=y;k++)if(((k-2020)%12+12)%12===i)a.push(k);return a.slice(-5)};
const TTI_ALL=['주변 사람 덕을 보는 날이에요. 도움을 청하는 걸 망설이지 마세요.','서두르면 실수가 생겨요. 천천히 가는 게 오히려 빨라요.','기다리던 소식이 오거나 일이 한 단계 나아가요.','말 한마디로 오해가 풀리는 날이에요. 먼저 다가가 보세요.','몸이 쉽게 지치는 날이에요. 일찍 쉬는 게 남는 거예요.','작은 행운이 연달아 찾아와요. 웃을 일이 많아요.','새 일을 벌이기보다 하던 일을 마무리하기 좋은 날이에요.','돈 문제는 꼼꼼하게, 사람 문제는 너그럽게 보면 좋아요.'];
const TTI_YEAR=['가족과 보내는 시간에서 힘을 얻어요.','오래된 친구가 좋은 소식을 들고 와요.','운동이나 건강검진을 시작하기 좋은 때예요.','일에서 인정받고 맡는 몫이 조금 늘어나요.','서류나 계약서는 한 번 더 읽고 서명하세요.','새로 시작한 취미가 생활에 활력을 줘요.','지출이 늘 수 있으니 이번 주 예산을 정해 두세요.','뜻밖의 칭찬에 기분 좋은 하루예요.','고민하던 선택에 답이 보이기 시작해요.','이동이 많은 날이에요. 길 위에서 좋은 인연을 만나요.','시험이나 면접이 있다면 자신 있게 임하세요.','말을 아끼면 복이 쌓이는 날이에요.'];
const DIRS=['동쪽','서쪽','남쪽','북쪽','동남쪽','서북쪽','동북쪽','서남쪽'];
VIEWS.tti=(arg)=>{
  let cur=arg!=null&&arg!==''?+arg:SJ().ttiIdx;
  app.innerHTML=`${back()}
  <h1 class="pagetitle">띠별 운세</h1><p class="lead">내 띠를 고르면 오늘의 운세와 출생년도별 한마디를 볼 수 있어요.</p>
  <div class="finder"><label for="tby">태어난 해로 찾기</label><input type="number" id="tby" min="1930" max="${new Date().getFullYear()}" value="${SJ().y}" style="width:110px"></div>
  <div class="zgrid" id="tg">${TTI.map(([n,h],i)=>`<button type="button" class="zbtn" data-t="${i}" aria-pressed="${i===cur}"><span class="sym">${h}</span><b>${n}띠${i===SJ().ttiIdx?' · 나':''}</b><small>${ttiYears(i).slice(-3).map(y=>String(y).slice(2)).join('·')}년생</small></button>`).join('')}</div>
  <div id="tr"></div>`;
  const render=()=>{
    $('#tg').querySelectorAll('.zbtn').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.t===cur));
    const[n,h]=TTI[cur],r=seedOf('tti'+cur+TODAY()),sc=55+Math.floor(r()*41);
    $('#tr').innerHTML=ring(sc,`${h} ${n}띠 · 오늘의 운세`,pickR(r,TTI_ALL))+
      `<div class="panel mt"><h3 style="margin-top:0">출생년도별 한마디</h3><div class="years">${ttiYears(cur).map(y=>`<div><b>${String(y).slice(2)}년생</b><span>${pickR(seedOf('tti'+y+TODAY()),TTI_YEAR)}</span></div>`).join('')}</div></div>
      <div class="lucky mt" style="grid-template-columns:repeat(3,1fr)"><div><small>행운의 방향</small><b>${pickR(r,DIRS)}</b></div><div><small>행운의 색</small><b>${pickR(r,LUCKY_COLOR)}</b></div><div><small>행운의 숫자</small><b>${1+Math.floor(r()*9)}</b></div></div>
      <p class="note">띠는 설날(또는 입춘)을 기준으로 바뀌어서 1~2월생은 앞 띠일 수 있어요. 재미로만 봐주세요.</p>`;
  };
  $('#tg').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;cur=+b.dataset.t;render()};
  $('#tby').onchange=e=>{const y=+e.target.value;if(!y)return;cur=((y-2020)%12+12)%12;render();toast(`${TTI[cur][0]}띠예요`)};
  render();
};

/* ---------- 시작 ---------- */
loadProfile();
selfCheck();
initBar();
const h=location.hash.slice(1);go(VIEWS[h]?h:'home');

/* ---------- 일반/다크 토글 ---------- */
(function(){
  const root=document.documentElement,btn=document.getElementById('themebtn');
  const paint=()=>{const dark=root.getAttribute('data-theme')==='dark';document.getElementById('themeico').textContent=dark?'☀':'☾';document.getElementById('themelbl').textContent=dark?'일반모드':'다크모드';btn.setAttribute('aria-pressed',dark)};
  if(!root.getAttribute('data-theme'))root.setAttribute('data-theme','light');
  btn.onclick=()=>{const next=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',next);try{localStorage.setItem('ungyeol-theme',next)}catch(e){}paint()};
  paint();
})();
</script>
